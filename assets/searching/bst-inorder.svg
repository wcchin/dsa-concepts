<svg xmlns="http://www.w3.org/2000/svg" width="820" height="415" viewBox="0 0 820 415" role="img" aria-labelledby="title desc"><title id="title">Inorder visits in ascending order</title><desc id="desc">Each node is labelled with its visit number. The order is 20 30 40 50 60 70 80.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="24" text-anchor="start">Inorder: left subtree, node, right subtree</text><path d="M400.0,109 L210.0,149" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M210.0,197 L115.0,237" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M210.0,197 L305.0,237" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M400.0,109 L590.0,149" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M590.0,197 L495.0,237" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M590.0,197 L685.0,237" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="400.0" cy="85" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="400.0" y="91" font-size="18" text-anchor="middle">50</text><rect x="370.5" y="115" width="59" height="19" fill="white"/><text x="400.0" y="130" font-size="14" text-anchor="middle">visit 4</text><circle cx="210.0" cy="173" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="210.0" y="179" font-size="18" text-anchor="middle">30</text><rect x="180.5" y="203" width="59" height="19" fill="white"/><text x="210.0" y="218" font-size="14" text-anchor="middle">visit 2</text><circle cx="115.0" cy="261" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="115.0" y="267" font-size="18" text-anchor="middle">20</text><rect x="85.5" y="291" width="59" height="19" fill="white"/><text x="115.0" y="306" font-size="14" text-anchor="middle">visit 1</text><circle cx="305.0" cy="261" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="305.0" y="267" font-size="18" text-anchor="middle">40</text><rect x="275.5" y="291" width="59" height="19" fill="white"/><text x="305.0" y="306" font-size="14" text-anchor="middle">visit 3</text><circle cx="590.0" cy="173" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="590.0" y="179" font-size="18" text-anchor="middle">70</text><rect x="560.5" y="203" width="59" height="19" fill="white"/><text x="590.0" y="218" font-size="14" text-anchor="middle">visit 6</text><circle cx="495.0" cy="261" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="495.0" y="267" font-size="18" text-anchor="middle">60</text><rect x="465.5" y="291" width="59" height="19" fill="white"/><text x="495.0" y="306" font-size="14" text-anchor="middle">visit 5</text><circle cx="685.0" cy="261" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="685.0" y="267" font-size="18" text-anchor="middle">80</text><rect x="655.5" y="291" width="59" height="19" fill="white"/><text x="685.0" y="306" font-size="14" text-anchor="middle">visit 7</text><text x="24" y="380" font-size="21" text-anchor="start">Output: 20, 30, 40, 50, 60, 70, 80</text></g></svg>