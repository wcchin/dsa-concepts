<svg xmlns="http://www.w3.org/2000/svg" width="760" height="325" viewBox="0 0 760 325" role="img" aria-labelledby="title desc"><title id="title">An inclusive binary-search interval</title><desc id="desc">Search for 18 probes index 2 with value 11, then index 3 with value 18. Grey positions have been excluded.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Binary search: discard only positions proved impossible</text><text x="24" y="115" font-size="18" text-anchor="start">low = 0; high = 4</text><text x="333" y="73" font-size="16" text-anchor="middle">0</text><rect x="300" y="85" width="65" height="48" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="333" y="117" font-size="23" text-anchor="middle">3</text><text x="413" y="73" font-size="16" text-anchor="middle">1</text><rect x="380" y="85" width="65" height="48" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="413" y="117" font-size="23" text-anchor="middle">7</text><text x="493" y="73" font-size="16" text-anchor="middle">2</text><rect x="460" y="85" width="65" height="48" rx="6" fill="#ffe5c5" stroke="#8294a5"/><text x="493" y="117" font-size="23" text-anchor="middle">11</text><text x="573" y="73" font-size="16" text-anchor="middle">3</text><rect x="540" y="85" width="65" height="48" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="573" y="117" font-size="23" text-anchor="middle">18</text><text x="653" y="73" font-size="16" text-anchor="middle">4</text><rect x="620" y="85" width="65" height="48" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="653" y="117" font-size="23" text-anchor="middle">24</text><text x="300" y="165" font-size="18" text-anchor="start">11 &lt; 18: exclude indices 0–2</text><text x="24" y="230" font-size="18" text-anchor="start">low = 3; high = 4</text><text x="333" y="188" font-size="16" text-anchor="middle">0</text><rect x="300" y="200" width="65" height="48" rx="6" fill="#eef1f5" stroke="#8294a5"/><text x="333" y="232" font-size="23" text-anchor="middle">3</text><text x="413" y="188" font-size="16" text-anchor="middle">1</text><rect x="380" y="200" width="65" height="48" rx="6" fill="#eef1f5" stroke="#8294a5"/><text x="413" y="232" font-size="23" text-anchor="middle">7</text><text x="493" y="188" font-size="16" text-anchor="middle">2</text><rect x="460" y="200" width="65" height="48" rx="6" fill="#eef1f5" stroke="#8294a5"/><text x="493" y="232" font-size="23" text-anchor="middle">11</text><text x="573" y="188" font-size="16" text-anchor="middle">3</text><rect x="540" y="200" width="65" height="48" rx="6" fill="#ffe5c5" stroke="#8294a5"/><text x="573" y="232" font-size="23" text-anchor="middle">18</text><text x="653" y="188" font-size="16" text-anchor="middle">4</text><rect x="620" y="200" width="65" height="48" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="653" y="232" font-size="23" text-anchor="middle">24</text><text x="300" y="280" font-size="18" text-anchor="start">18 = 18: return index 3</text></g></svg>