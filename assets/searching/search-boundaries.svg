<svg xmlns="http://www.w3.org/2000/svg" width="850" height="485" viewBox="0 0 850 485" role="img" aria-labelledby="title desc"><title id="title">Duplicate-aware binary-search boundaries</title><desc id="desc">Values1 2 2 2 4 7 have lower bound1 and upper bound4 for target2, yielding three equal entries.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="23" text-anchor="start">Lower and upper bounds surround the complete duplicate run</text><text x="130" y="115" font-size="18" text-anchor="middle">0</text><rect x="85" y="140" width="90" height="65" rx="5" fill="#eef1f5" stroke="#8196a7"/><text x="130" y="182" font-size="25" text-anchor="middle">1</text><text x="235" y="115" font-size="18" text-anchor="middle">1</text><rect x="190" y="140" width="90" height="65" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="235" y="182" font-size="25" text-anchor="middle">2</text><text x="340" y="115" font-size="18" text-anchor="middle">2</text><rect x="295" y="140" width="90" height="65" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="340" y="182" font-size="25" text-anchor="middle">2</text><text x="445" y="115" font-size="18" text-anchor="middle">3</text><rect x="400" y="140" width="90" height="65" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="445" y="182" font-size="25" text-anchor="middle">2</text><text x="550" y="115" font-size="18" text-anchor="middle">4</text><rect x="505" y="140" width="90" height="65" rx="5" fill="#eef1f5" stroke="#8196a7"/><text x="550" y="182" font-size="25" text-anchor="middle">4</text><text x="655" y="115" font-size="18" text-anchor="middle">5</text><rect x="610" y="140" width="90" height="65" rx="5" fill="#eef1f5" stroke="#8196a7"/><text x="655" y="182" font-size="25" text-anchor="middle">7</text><path d="M190,265 L190,210" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="190" y="300" font-size="19" text-anchor="middle">lower_bound(2) = 1</text><path d="M505,350 L505,210" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="505" y="385" font-size="19" text-anchor="middle">upper_bound(2) = 4</text><text x="24" y="445" font-size="21" text-anchor="start">Equal values occupy [1,4); count = 4 − 1 = 3.</text></g></svg>