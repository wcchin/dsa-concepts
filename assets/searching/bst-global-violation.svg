<svg xmlns="http://www.w3.org/2000/svg" width="810" height="370" viewBox="0 0 810 370" role="img" aria-labelledby="title desc"><title id="title">A global BST violation</title><desc id="desc">15 is the left child of 30 but is also in the right subtree of 20, violating the inherited lower bound.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Immediate parent checks miss ancestor violations</text><path d="M255.0,109 L375.0,146" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M375.0,194 L315.0,231" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="255.0" cy="85" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="255.0" y="91" font-size="18" text-anchor="middle">20</text><circle cx="375.0" cy="170" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="375.0" y="176" font-size="18" text-anchor="middle">30</text><circle cx="315.0" cy="255" r="24" fill="#fbe0e0" stroke="#72899b" stroke-width="1.8"/><text x="315.0" y="261" font-size="18" text-anchor="middle">15</text><text x="485" y="170" font-size="18" text-anchor="start">15 &lt; 30: parent test passes</text><text x="485" y="210" font-size="18" text-anchor="start">15 &gt; 20: required, but false</text><text x="24" y="335" font-size="20" text-anchor="start">Every node in 20’s right subtree must exceed 20.</text></g></svg>