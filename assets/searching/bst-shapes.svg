<svg xmlns="http://www.w3.org/2000/svg" width="840" height="590" viewBox="0 0 840 590" role="img" aria-labelledby="title desc"><title id="title">Balanced and chain-shaped BSTs</title><desc id="desc">The same seven keys form a balanced height-two tree and an ascending right chain of height six.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="24" text-anchor="start">Same keys; very different path lengths</text><text x="24" y="78" font-size="19" text-anchor="start">Balanced shape: height 2</text><path d="M220.0,147 L115.0,188" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M115.0,232 L62.5,273" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M115.0,232 L167.5,273" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M220.0,147 L325.0,188" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M325.0,232 L272.5,273" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M325.0,232 L377.5,273" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="220.0" cy="125" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="220.0" y="131" font-size="18" text-anchor="middle">50</text><circle cx="115.0" cy="210" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="115.0" y="216" font-size="18" text-anchor="middle">30</text><circle cx="62.5" cy="295" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="62.5" y="301" font-size="18" text-anchor="middle">20</text><circle cx="167.5" cy="295" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="167.5" y="301" font-size="18" text-anchor="middle">40</text><circle cx="325.0" cy="210" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="325.0" y="216" font-size="18" text-anchor="middle">70</text><circle cx="272.5" cy="295" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="272.5" y="301" font-size="18" text-anchor="middle">60</text><circle cx="377.5" cy="295" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="377.5" y="301" font-size="18" text-anchor="middle">80</text><circle cx="530" cy="115" r="21" fill="#ffe5c5" stroke="#72899b"/><text x="530" y="121" font-size="18" text-anchor="middle">20</text><path d="M530,135 L565,155" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="565" cy="175" r="21" fill="#ffe5c5" stroke="#72899b"/><text x="565" y="181" font-size="18" text-anchor="middle">30</text><path d="M565,195 L600,215" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="600" cy="235" r="21" fill="#ffe5c5" stroke="#72899b"/><text x="600" y="241" font-size="18" text-anchor="middle">40</text><path d="M600,255 L635,275" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="635" cy="295" r="21" fill="#ffe5c5" stroke="#72899b"/><text x="635" y="301" font-size="18" text-anchor="middle">50</text><path d="M635,315 L670,335" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="670" cy="355" r="21" fill="#ffe5c5" stroke="#72899b"/><text x="670" y="361" font-size="18" text-anchor="middle">60</text><path d="M670,375 L705,395" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="705" cy="415" r="21" fill="#ffe5c5" stroke="#72899b"/><text x="705" y="421" font-size="18" text-anchor="middle">70</text><path d="M705,435 L740,455" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="740" cy="475" r="21" fill="#ffe5c5" stroke="#72899b"/><text x="740" y="481" font-size="18" text-anchor="middle">80</text><text x="480" y="78" font-size="19" text-anchor="start">Sorted insertion: height 6</text><text x="24" y="555" font-size="20" text-anchor="start">Both are valid BSTs. Balance is an additional condition.</text></g></svg>