<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">The reference BST</title><desc id="desc">Root 50 has left subtree 30 with children 20 40, and right subtree 70 with children 60 80. Green marks the entire left subtree.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="24" text-anchor="start">A BST orders entire subtrees</text><path d="M360.0,109 L190.0,141" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M190.0,189 L105.0,221" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M190.0,189 L275.0,221" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M360.0,109 L530.0,141" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M530.0,189 L445.0,221" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M530.0,189 L615.0,221" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="360.0" cy="85" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="360.0" y="91" font-size="18" text-anchor="middle">50</text><rect x="295.5" y="115" width="129" height="19" fill="white"/><text x="360.0" y="130" font-size="14" text-anchor="middle">depth 0; height 2</text><circle cx="190.0" cy="165" r="24" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="190.0" y="171" font-size="18" text-anchor="middle">30</text><rect x="160.5" y="195" width="59" height="19" fill="white"/><text x="190.0" y="210" font-size="14" text-anchor="middle">depth 1</text><circle cx="105.0" cy="245" r="24" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="105.0" y="251" font-size="18" text-anchor="middle">20</text><rect x="54.5" y="275" width="101" height="19" fill="white"/><text x="105.0" y="290" font-size="14" text-anchor="middle">depth 2; leaf</text><circle cx="275.0" cy="245" r="24" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="275.0" y="251" font-size="18" text-anchor="middle">40</text><circle cx="530.0" cy="165" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="530.0" y="171" font-size="18" text-anchor="middle">70</text><circle cx="445.0" cy="245" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="445.0" y="251" font-size="18" text-anchor="middle">60</text><circle cx="615.0" cy="245" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="615.0" y="251" font-size="18" text-anchor="middle">80</text><text x="24" y="335" font-size="19" text-anchor="start">Green subtree: every key is below 50, including 40.</text></g></svg>