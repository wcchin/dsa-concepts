<svg xmlns="http://www.w3.org/2000/svg" width="880" height="535" viewBox="0 0 880 535" role="img" aria-labelledby="title desc"><title id="title">Two-child deletion retaining 65</title><desc id="desc">Copy successor 60 into the root key field; remove its original node by setting 70.left to 65.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="24" text-anchor="start">Delete 50: keep the successor’s right child</text><text x="24" y="76" font-size="18" text-anchor="start">Before: successor 60 has child 65</text><text x="450" y="76" font-size="18" text-anchor="start">After: root key 60; 70.left is 65</text><path d="M215.0,142 L115.0,173" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M115.0,217 L65.0,248" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M115.0,217 L165.0,248" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M215.0,142 L315.0,173" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M315.0,217 L265.0,248" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M265.0,292 L290.0,323" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M315.0,217 L365.0,248" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="215.0" cy="120" r="22" fill="#ffe5c5" stroke="#72899b" stroke-width="1.8"/><text x="215.0" y="126" font-size="18" text-anchor="middle">50</text><circle cx="115.0" cy="195" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="115.0" y="201" font-size="18" text-anchor="middle">30</text><circle cx="65.0" cy="270" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="65.0" y="276" font-size="18" text-anchor="middle">20</text><circle cx="165.0" cy="270" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="165.0" y="276" font-size="18" text-anchor="middle">40</text><circle cx="315.0" cy="195" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="315.0" y="201" font-size="18" text-anchor="middle">70</text><circle cx="265.0" cy="270" r="22" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="265.0" y="276" font-size="18" text-anchor="middle">60</text><circle cx="290.0" cy="345" r="22" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="290.0" y="351" font-size="18" text-anchor="middle">65</text><circle cx="365.0" cy="270" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="365.0" y="276" font-size="18" text-anchor="middle">80</text><path d="M645.0,142 L545.0,173" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M545.0,217 L495.0,248" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M545.0,217 L595.0,248" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M645.0,142 L745.0,173" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M745.0,217 L695.0,248" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M745.0,217 L795.0,248" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="645.0" cy="120" r="22" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="645.0" y="126" font-size="18" text-anchor="middle">60</text><circle cx="545.0" cy="195" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="545.0" y="201" font-size="18" text-anchor="middle">30</text><circle cx="495.0" cy="270" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="495.0" y="276" font-size="18" text-anchor="middle">20</text><circle cx="595.0" cy="270" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="595.0" y="276" font-size="18" text-anchor="middle">40</text><circle cx="745.0" cy="195" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="745.0" y="201" font-size="18" text-anchor="middle">70</text><circle cx="695.0" cy="270" r="22" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="695.0" y="276" font-size="18" text-anchor="middle">65</text><circle cx="795.0" cy="270" r="22" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="795.0" y="276" font-size="18" text-anchor="middle">80</text><text x="24" y="460" font-size="18" text-anchor="start">Copy the key into the existing root, then remove the original successor.</text><text x="24" y="500" font-size="21" text-anchor="start">Inorder: 20, 30, 40, 60, 65, 70, 80</text></g></svg>