<svg xmlns="http://www.w3.org/2000/svg" width="840" height="545" viewBox="0 0 840 545" role="img" aria-labelledby="title desc"><title id="title">The shared k-d tree with active axes</title><desc id="desc">A has children B C. B has left D, D has right E. C has right F, F has right G. Axes alternate x y x y.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Shared k-d tree: split axes alternate with depth</text><path d="M400,127 L210,178" stroke="#647c8f" stroke-width="2" fill="none"/><text x="305.0" y="152.5" font-size="15" text-anchor="middle">L</text><path d="M400,127 L590,178" stroke="#647c8f" stroke-width="2" fill="none"/><text x="495.0" y="152.5" font-size="15" text-anchor="middle">R</text><path d="M210,232 L110,283" stroke="#647c8f" stroke-width="2" fill="none"/><text x="160.0" y="257.5" font-size="15" text-anchor="middle">L</text><path d="M110,337 L185,388" stroke="#647c8f" stroke-width="2" fill="none"/><text x="147.5" y="362.5" font-size="15" text-anchor="middle">R</text><path d="M590,232 L690,283" stroke="#647c8f" stroke-width="2" fill="none"/><text x="640.0" y="257.5" font-size="15" text-anchor="middle">R</text><path d="M690,337 L755,388" stroke="#647c8f" stroke-width="2" fill="none"/><text x="722.5" y="362.5" font-size="15" text-anchor="middle">R</text><rect x="356" y="73" width="88" height="54" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="400" y="95" font-size="15" text-anchor="middle">A (5, 4)</text><text x="400" y="117" font-size="15" text-anchor="middle">axis x</text><rect x="166" y="178" width="88" height="54" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="210" y="200" font-size="15" text-anchor="middle">B (2, 7)</text><text x="210" y="222" font-size="15" text-anchor="middle">axis y</text><rect x="546" y="178" width="88" height="54" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="590" y="200" font-size="15" text-anchor="middle">C (8, 1)</text><text x="590" y="222" font-size="15" text-anchor="middle">axis y</text><rect x="66" y="283" width="88" height="54" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="110" y="305" font-size="15" text-anchor="middle">D (1, 3)</text><text x="110" y="327" font-size="15" text-anchor="middle">axis x</text><rect x="141" y="388" width="88" height="54" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="185" y="410" font-size="15" text-anchor="middle">E (3, 6)</text><text x="185" y="432" font-size="15" text-anchor="middle">axis y</text><rect x="646" y="283" width="88" height="54" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="690" y="305" font-size="15" text-anchor="middle">F (7, 5)</text><text x="690" y="327" font-size="15" text-anchor="middle">axis x</text><rect x="711" y="388" width="88" height="54" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="755" y="410" font-size="15" text-anchor="middle">G (9, 2)</text><text x="755" y="432" font-size="15" text-anchor="middle">axis y</text><text x="24" y="510" font-size="18" text-anchor="start">Insertion order: A, B, C, D, E, F, G. Equal split coordinates go right.</text></g></svg>