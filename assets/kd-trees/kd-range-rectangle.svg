<svg xmlns="http://www.w3.org/2000/svg" width="850" height="590" viewBox="0 0 850 590" role="img" aria-labelledby="title desc"><title id="title">A rectangular range query</title><desc id="desc">The green inclusive rectangle contains B D E. Its upper x bound four is below the root split five, excluding C F G.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="30" font-size="23" text-anchor="start">Inclusive range: x ∈ [1,4], y ∈ [2,7]</text><path d="M100,485 L100,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="100" y="506.0" font-size="14" text-anchor="middle">0</text><path d="M100,485 L520,485" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="490" font-size="14" text-anchor="end">0</text><path d="M142,485 L142,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="142" y="506.0" font-size="14" text-anchor="middle">1</text><path d="M100,443 L520,443" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="448" font-size="14" text-anchor="end">1</text><path d="M184,485 L184,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="184" y="506.0" font-size="14" text-anchor="middle">2</text><path d="M100,401 L520,401" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="406" font-size="14" text-anchor="end">2</text><path d="M226,485 L226,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="226" y="506.0" font-size="14" text-anchor="middle">3</text><path d="M100,359 L520,359" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="364" font-size="14" text-anchor="end">3</text><path d="M268,485 L268,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="268" y="506.0" font-size="14" text-anchor="middle">4</text><path d="M100,317 L520,317" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="322" font-size="14" text-anchor="end">4</text><path d="M310,485 L310,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="310" y="506.0" font-size="14" text-anchor="middle">5</text><path d="M100,275 L520,275" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="280" font-size="14" text-anchor="end">5</text><path d="M352,485 L352,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="352" y="506.0" font-size="14" text-anchor="middle">6</text><path d="M100,233 L520,233" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="238" font-size="14" text-anchor="end">6</text><path d="M394,485 L394,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="394" y="506.0" font-size="14" text-anchor="middle">7</text><path d="M100,191 L520,191" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="196" font-size="14" text-anchor="end">7</text><path d="M436,485 L436,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="436" y="506.0" font-size="14" text-anchor="middle">8</text><path d="M100,149 L520,149" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="154" font-size="14" text-anchor="end">8</text><path d="M478,485 L478,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="478" y="506.0" font-size="14" text-anchor="middle">9</text><path d="M100,107 L520,107" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="112" font-size="14" text-anchor="end">9</text><path d="M520,485 L520,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="520" y="506.0" font-size="14" text-anchor="middle">10</text><path d="M100,65 L520,65" stroke="#e6ebf0" stroke-width="2" fill="none"/><text x="82" y="70" font-size="14" text-anchor="end">10</text><text x="545" y="491" font-size="19" text-anchor="start">x</text><text x="90" y="47" font-size="19" text-anchor="start">y</text><rect x="142" y="191" width="126" height="210" fill="#d7f0e6" fill-opacity="0.6" stroke="#17816a" stroke-width="2.5"/><path d="M310,485 L310,65" stroke="#397ca9" stroke-width="2" fill="none"/><path d="M100,191 L310,191" stroke="#c8832d" stroke-width="2" fill="none"/><path d="M310,443 L520,443" stroke="#c8832d" stroke-width="2" fill="none"/><path d="M142,485 L142,191" stroke="#397ca9" stroke-width="2" fill="none"/><path d="M394,443 L394,65" stroke="#397ca9" stroke-width="2" fill="none"/><path d="M142,233 L310,233" stroke="#c8832d" stroke-width="2" fill="none"/><path d="M394,401 L520,401" stroke="#c8832d" stroke-width="2" fill="none"/><circle cx="310" cy="317" r="5" fill="#182f49"/><text x="319" y="308" font-size="15" text-anchor="start">A (5, 4)</text><circle cx="184" cy="191" r="5" fill="#182f49"/><text x="193" y="182" font-size="15" text-anchor="start">B (2, 7)</text><circle cx="436" cy="443" r="5" fill="#182f49"/><text x="445" y="434" font-size="15" text-anchor="start">C (8, 1)</text><circle cx="142" cy="359" r="5" fill="#182f49"/><text x="151" y="350" font-size="15" text-anchor="start">D (1, 3)</text><circle cx="226" cy="233" r="5" fill="#182f49"/><text x="235" y="224" font-size="15" text-anchor="start">E (3, 6)</text><circle cx="394" cy="275" r="5" fill="#182f49"/><text x="403" y="266" font-size="15" text-anchor="start">F (7, 5)</text><circle cx="478" cy="401" r="5" fill="#182f49"/><text x="487" y="392" font-size="15" text-anchor="start">G (9, 2)</text><text x="580" y="105" font-size="20" text-anchor="start">Inside: B, D, E</text><text x="580" y="165" font-size="18" text-anchor="start">A is outside.</text><text x="580" y="200" font-size="17" text-anchor="start">Its left region still matters.</text><text x="580" y="260" font-size="18" text-anchor="start">At root x = 5:</text><text x="580" y="295" font-size="17" text-anchor="start">query upper x = 4 &lt; 5</text><text x="580" y="330" font-size="17" text-anchor="start">skip the whole right side</text><text x="24" y="560" font-size="18" text-anchor="start">A boundary point counts as inside; B and D lie on rectangle edges.</text></g></svg>