<svg xmlns="http://www.w3.org/2000/svg" width="850" height="545" viewBox="0 0 850 545" role="img" aria-labelledby="title desc"><title id="title">Median construction with coordinate ties</title><desc id="desc">Putting point 5,1 left of an x5 split violates strict-left ordering. A compatible example routes it right at x5 then left at a y3 split.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="22" text-anchor="start">A median index does not resolve equal split coordinates</text><text x="24" y="88" font-size="20" text-anchor="start">Incompatible with strict-left routing</text><path d="M205.0,176 L112.5,204" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M205.0,176 L297.5,204" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="205.0" cy="140" r="36" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="205.0" y="146" font-size="15" text-anchor="middle">(5,2)</text><circle cx="112.5" cy="240" r="36" fill="#fbe0e0" stroke="#72899b" stroke-width="1.8"/><text x="112.5" y="246" font-size="15" text-anchor="middle">(5,1)</text><circle cx="297.5" cy="240" r="36" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="297.5" y="246" font-size="15" text-anchor="middle">(5,3)</text><text x="450" y="88" font-size="20" text-anchor="start">Compatible ties-right grouping</text><path d="M610.0,176 L702.5,204" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M702.5,276 L656.25,304" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="610.0" cy="140" r="36" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="610.0" y="146" font-size="15" text-anchor="middle">(5,2)</text><circle cx="702.5" cy="240" r="36" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="702.5" y="246" font-size="15" text-anchor="middle">(5,3)</text><circle cx="656.25" cy="340" r="36" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="656.25" y="346" font-size="15" text-anchor="middle">(5,1)</text><text x="24" y="420" font-size="18" text-anchor="start">Left child has x = 5: violates x &lt; 5.</text><text x="450" y="420" font-size="17" text-anchor="start">At root all other x = 5 points go right.</text><text x="450" y="455" font-size="17" text-anchor="start">At depth 1, y comparisons apply.</text><text x="24" y="510" font-size="18" text-anchor="start">The compatible example preserves the tie rule, but is not automatically balanced.</text></g></svg>