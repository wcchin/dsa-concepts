<svg xmlns="http://www.w3.org/2000/svg" width="850" height="590" viewBox="0 0 850 590" role="img" aria-labelledby="title desc"><title id="title">A nearest neighbour on the other side</title><desc id="desc">Query 4.9,5 lies left of x5, but right point 5.1,5 is nearer than the left point 1,5. Split distance 0.1 cannot exclude the right region.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Nearest search must sometimes cross the split</text><path d="M100,470 L100,110" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="100" y="494.0" font-size="15" text-anchor="middle">0</text><path d="M160,470 L160,110" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="160" y="494.0" font-size="15" text-anchor="middle">1</text><path d="M220,470 L220,110" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="220" y="494.0" font-size="15" text-anchor="middle">2</text><path d="M280,470 L280,110" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="280" y="494.0" font-size="15" text-anchor="middle">3</text><path d="M340,470 L340,110" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="340" y="494.0" font-size="15" text-anchor="middle">4</text><path d="M400,470 L400,110" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="400" y="494.0" font-size="15" text-anchor="middle">5</text><path d="M460,470 L460,110" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="460" y="494.0" font-size="15" text-anchor="middle">6</text><path d="M520,470 L520,110" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="520" y="494.0" font-size="15" text-anchor="middle">7</text><path d="M100,470 L520,470" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="80" y="475" font-size="15" text-anchor="end">0</text><path d="M100,410 L520,410" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="80" y="415" font-size="15" text-anchor="end">1</text><path d="M100,350 L520,350" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="80" y="355" font-size="15" text-anchor="end">2</text><path d="M100,290 L520,290" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="80" y="295" font-size="15" text-anchor="end">3</text><path d="M100,230 L520,230" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="80" y="235" font-size="15" text-anchor="end">4</text><path d="M100,170 L520,170" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="80" y="175" font-size="15" text-anchor="end">5</text><path d="M100,110 L520,110" stroke="#e5ebef" stroke-width="2" fill="none"/><text x="80" y="115" font-size="15" text-anchor="end">6</text><path d="M400,470 L400,110" stroke="#397ca9" stroke-width="2" fill="none"/><circle cx="400" cy="470" r="5" fill="#182f49"/><text x="412" y="458" font-size="17" text-anchor="start">Root (5,0)</text><circle cx="160" cy="170" r="5" fill="#182f49"/><text x="122" y="152" font-size="17" text-anchor="start">Left (1,5)</text><circle cx="406.0" cy="170" r="5" fill="#17816a"/><text x="421.0" y="154" font-size="17" text-anchor="start">Nearest (5.1,5)</text><circle cx="394.0" cy="170" r="5" fill="#bf5c39"/><text x="304.0" y="198" font-size="17" text-anchor="start">Q (4.9,5)</text><path d="M160,170 L394.0,170" stroke="#bf5c39" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="580" y="135" font-size="18" text-anchor="start">Near-side best: 3.9</text><text x="580" y="180" font-size="18" text-anchor="start">Distance to split: 0.1</text><text x="580" y="225" font-size="18" text-anchor="start">Far-side candidate: 0.2</text><text x="580" y="290" font-size="20" text-anchor="start">0.1 &lt; 3.9:</text><text x="580" y="325" font-size="16" text-anchor="start">the right side cannot be pruned.</text><text x="24" y="555" font-size="18" text-anchor="start">Geometric distances use the same scale on both axes.</text></g></svg>