<svg xmlns="http://www.w3.org/2000/svg" width="840" height="585" viewBox="0 0 840 585" role="img" aria-labelledby="title desc"><title id="title">Successful and unsuccessful exact searches</title><desc id="desc">The highlighted path A B D E finds 3,6. A second path A C F reaches the missing left child for 5,7.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="22" text-anchor="start">Exact search: full equality before an axis comparison</text><path d="M360.0,114.3 L189.0,160.20000000000002" stroke="#647c8f" stroke-width="2" fill="none"/><text x="274.5" y="137.25" font-size="15" text-anchor="middle">L</text><path d="M360.0,114.3 L531.0,160.20000000000002" stroke="#647c8f" stroke-width="2" fill="none"/><text x="445.5" y="137.25" font-size="15" text-anchor="middle">R</text><path d="M189.0,208.8 L99.0,254.70000000000002" stroke="#647c8f" stroke-width="2" fill="none"/><text x="144.0" y="231.75" font-size="15" text-anchor="middle">L</text><path d="M99.0,303.3 L166.5,349.2" stroke="#647c8f" stroke-width="2" fill="none"/><text x="132.75" y="326.25" font-size="15" text-anchor="middle">R</text><path d="M531.0,208.8 L621.0,254.70000000000002" stroke="#647c8f" stroke-width="2" fill="none"/><text x="576.0" y="231.75" font-size="15" text-anchor="middle">R</text><path d="M621.0,303.3 L679.5,349.2" stroke="#647c8f" stroke-width="2" fill="none"/><text x="650.25" y="326.25" font-size="15" text-anchor="middle">R</text><rect x="320.4" y="65.7" width="79.2" height="48.6" rx="6" fill="#ffe5c5" stroke="#8294a5"/><text x="360.0" y="85.5" font-size="13.5" text-anchor="middle">A (5, 4)</text><text x="360.0" y="105.3" font-size="13.5" text-anchor="middle">axis x</text><rect x="149.4" y="160.2" width="79.2" height="48.6" rx="6" fill="#ffe5c5" stroke="#8294a5"/><text x="189.0" y="180.0" font-size="13.5" text-anchor="middle">B (2, 7)</text><text x="189.0" y="199.8" font-size="13.5" text-anchor="middle">axis y</text><rect x="491.4" y="160.2" width="79.2" height="48.6" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="531.0" y="180.0" font-size="13.5" text-anchor="middle">C (8, 1)</text><text x="531.0" y="199.8" font-size="13.5" text-anchor="middle">axis y</text><rect x="59.4" y="254.7" width="79.2" height="48.6" rx="6" fill="#ffe5c5" stroke="#8294a5"/><text x="99.0" y="274.5" font-size="13.5" text-anchor="middle">D (1, 3)</text><text x="99.0" y="294.3" font-size="13.5" text-anchor="middle">axis x</text><rect x="126.9" y="349.2" width="79.2" height="48.6" rx="6" fill="#ffe5c5" stroke="#8294a5"/><text x="166.5" y="369.0" font-size="13.5" text-anchor="middle">E (3, 6)</text><text x="166.5" y="388.8" font-size="13.5" text-anchor="middle">axis y</text><rect x="581.4" y="254.7" width="79.2" height="48.6" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="621.0" y="274.5" font-size="13.5" text-anchor="middle">F (7, 5)</text><text x="621.0" y="294.3" font-size="13.5" text-anchor="middle">axis x</text><rect x="639.9" y="349.2" width="79.2" height="48.6" rx="6" fill="#d5e9ff" stroke="#8294a5"/><text x="679.5" y="369.0" font-size="13.5" text-anchor="middle">G (9, 2)</text><text x="679.5" y="388.8" font-size="13.5" text-anchor="middle">axis y</text><text x="24" y="470" font-size="20" text-anchor="start">Match (3,6): A → B → D → E</text><text x="24" y="510" font-size="20" text-anchor="start">Absent (5,7): A → C → F → missing left child</text><text x="24" y="550" font-size="18" text-anchor="start">At A, x ties; the points differ, so the absent query goes right.</text></g></svg>