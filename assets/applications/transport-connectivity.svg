<svg xmlns="http://www.w3.org/2000/svg" width="850" height="630" viewBox="0 0 850 630" role="img" aria-labelledby="title desc"><title id="title">Incremental connectivity as nine links open</title><desc id="desc">AB AC BD CE DF merge sets; BC CD DE EF do not. Final components are A through F together and G alone.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="23" text-anchor="start">Opening order: connectivity changes only on a merge</text><text x="24" y="95" font-size="18" text-anchor="start">Link</text><text x="180" y="95" font-size="18" text-anchor="start">New merge?</text><text x="420" y="95" font-size="18" text-anchor="start">Components afterwards</text><rect x="20" y="120" width="780" height="36" rx="5" fill="#d7f0e6" stroke="#8297aa"/><text x="35" y="145" font-size="19" text-anchor="start">A–B</text><text x="210" y="145" font-size="19" text-anchor="start">yes</text><text x="555" y="145" font-size="21" text-anchor="middle">6</text><rect x="20" y="167" width="780" height="36" rx="5" fill="#d7f0e6" stroke="#8297aa"/><text x="35" y="192" font-size="19" text-anchor="start">A–C</text><text x="210" y="192" font-size="19" text-anchor="start">yes</text><text x="555" y="192" font-size="21" text-anchor="middle">5</text><rect x="20" y="214" width="780" height="36" rx="5" fill="#eef1f5" stroke="#8297aa"/><text x="35" y="239" font-size="19" text-anchor="start">B–C</text><text x="210" y="239" font-size="19" text-anchor="start">no</text><text x="555" y="239" font-size="21" text-anchor="middle">5</text><rect x="20" y="261" width="780" height="36" rx="5" fill="#d7f0e6" stroke="#8297aa"/><text x="35" y="286" font-size="19" text-anchor="start">B–D</text><text x="210" y="286" font-size="19" text-anchor="start">yes</text><text x="555" y="286" font-size="21" text-anchor="middle">4</text><rect x="20" y="308" width="780" height="36" rx="5" fill="#eef1f5" stroke="#8297aa"/><text x="35" y="333" font-size="19" text-anchor="start">C–D</text><text x="210" y="333" font-size="19" text-anchor="start">no</text><text x="555" y="333" font-size="21" text-anchor="middle">4</text><rect x="20" y="355" width="780" height="36" rx="5" fill="#d7f0e6" stroke="#8297aa"/><text x="35" y="380" font-size="19" text-anchor="start">C–E</text><text x="210" y="380" font-size="19" text-anchor="start">yes</text><text x="555" y="380" font-size="21" text-anchor="middle">3</text><rect x="20" y="402" width="780" height="36" rx="5" fill="#eef1f5" stroke="#8297aa"/><text x="35" y="427" font-size="19" text-anchor="start">D–E</text><text x="210" y="427" font-size="19" text-anchor="start">no</text><text x="555" y="427" font-size="21" text-anchor="middle">3</text><rect x="20" y="449" width="780" height="36" rx="5" fill="#d7f0e6" stroke="#8297aa"/><text x="35" y="474" font-size="19" text-anchor="start">D–F</text><text x="210" y="474" font-size="19" text-anchor="start">yes</text><text x="555" y="474" font-size="21" text-anchor="middle">2</text><rect x="20" y="496" width="780" height="36" rx="5" fill="#eef1f5" stroke="#8297aa"/><text x="35" y="521" font-size="19" text-anchor="start">E–F</text><text x="210" y="521" font-size="19" text-anchor="start">no</text><text x="555" y="521" font-size="21" text-anchor="middle">2</text><text x="24" y="590" font-size="19" text-anchor="start">Initially 7 components; finally 2. BC can improve travel without a merge.</text></g></svg>