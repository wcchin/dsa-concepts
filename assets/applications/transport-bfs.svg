<svg xmlns="http://www.w3.org/2000/svg" width="850" height="580" viewBox="0 0 850 580" role="img" aria-labelledby="title desc"><title id="title">Fewest-hop route and BFS parent layers</title><desc id="desc">BFS parents A B, A C, B D, C E, D F. The chosen A B D F route uses3 links and23 minutes. G is unreachable.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="24" text-anchor="start">BFS layers minimise links, not total minutes</text><path d="M120,130 L330,90" stroke="#248a72" stroke-width="3" fill="none"/><path d="M120,130 L330,260" stroke="#71889b" stroke-width="2" fill="none"/><path d="M330,90 L560,90" stroke="#248a72" stroke-width="3" fill="none"/><path d="M330,260 L560,260" stroke="#71889b" stroke-width="2" fill="none"/><path d="M560,90 L760,90" stroke="#248a72" stroke-width="3" fill="none"/><circle cx="120" cy="130" r="24" fill="#d7f0e6" stroke="#71889b" stroke-width="2"/><text x="120" y="137" font-size="22" text-anchor="middle">A</text><circle cx="330" cy="90" r="24" fill="#d7f0e6" stroke="#71889b" stroke-width="2"/><text x="330" y="97" font-size="22" text-anchor="middle">B</text><circle cx="330" cy="260" r="24" fill="#d5e9ff" stroke="#71889b" stroke-width="2"/><text x="330" y="267" font-size="22" text-anchor="middle">C</text><circle cx="560" cy="90" r="24" fill="#d7f0e6" stroke="#71889b" stroke-width="2"/><text x="560" y="97" font-size="22" text-anchor="middle">D</text><circle cx="560" cy="260" r="24" fill="#d5e9ff" stroke="#71889b" stroke-width="2"/><text x="560" y="267" font-size="22" text-anchor="middle">E</text><circle cx="760" cy="90" r="24" fill="#d7f0e6" stroke="#71889b" stroke-width="2"/><text x="760" y="97" font-size="22" text-anchor="middle">F</text><circle cx="100" cy="330" r="24" fill="#ffe5c5" stroke="#71889b" stroke-width="2"/><text x="100" y="337" font-size="22" text-anchor="middle">G</text><rect x="25" y="290" width="175" height="110" rx="5" fill="white" stroke="#8297aa"/><circle cx="100" cy="330" r="24" fill="#ffe5c5" stroke="#71889b" stroke-width="2"/><text x="100" y="337" font-size="22" text-anchor="middle">G</text><text x="100" y="385" font-size="17" text-anchor="middle">unreachable</text><text x="120" y="205" font-size="19" text-anchor="middle">hops 0</text><text x="330" y="425" font-size="19" text-anchor="middle">hops 1</text><text x="560" y="425" font-size="19" text-anchor="middle">hops 2</text><text x="760" y="205" font-size="19" text-anchor="middle">hops 3</text><text x="24" y="485" font-size="21" text-anchor="start">Selected A–B–D–F: 3 links; 12 + 3 + 8 = 23 minutes.</text><text x="24" y="535" font-size="19" text-anchor="start">G is outside the reached set; only BFS parent edges are shown.</text></g></svg>