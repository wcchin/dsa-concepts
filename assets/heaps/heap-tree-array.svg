<svg xmlns="http://www.w3.org/2000/svg" width="800" height="535" viewBox="0 0 800 535" role="img" aria-labelledby="title desc"><title id="title">A six-item heap as tree and array</title><desc id="desc">Valid heap 2 5 4 9 7 6 is stored in level order. Every tree node is labelled with its array index.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="22" text-anchor="start">One min-heap, two views: tree positions match array indices</text><path d="M380.0,113 L205.0,157" stroke="#70869a" stroke-width="2" fill="none"/><path d="M380.0,113 L555.0,157" stroke="#70869a" stroke-width="2" fill="none"/><path d="M205.0,203 L117.5,247" stroke="#70869a" stroke-width="2" fill="none"/><path d="M205.0,203 L292.5,247" stroke="#70869a" stroke-width="2" fill="none"/><path d="M555.0,203 L467.5,247" stroke="#70869a" stroke-width="2" fill="none"/><circle cx="380.0" cy="90" r="23" fill="#d5e9ff" stroke="#72899c" stroke-width="1.8"/><text x="380.0" y="97" font-size="21" text-anchor="middle">2</text><rect x="358.0" y="118" width="44" height="19" fill="white"/><text x="380.0" y="133" font-size="14" text-anchor="middle">i = 0</text><circle cx="205.0" cy="180" r="23" fill="#d5e9ff" stroke="#72899c" stroke-width="1.8"/><text x="205.0" y="187" font-size="21" text-anchor="middle">5</text><rect x="183.0" y="208" width="44" height="19" fill="white"/><text x="205.0" y="223" font-size="14" text-anchor="middle">i = 1</text><circle cx="555.0" cy="180" r="23" fill="#d5e9ff" stroke="#72899c" stroke-width="1.8"/><text x="555.0" y="187" font-size="21" text-anchor="middle">4</text><rect x="533.0" y="208" width="44" height="19" fill="white"/><text x="555.0" y="223" font-size="14" text-anchor="middle">i = 2</text><circle cx="117.5" cy="270" r="23" fill="#d5e9ff" stroke="#72899c" stroke-width="1.8"/><text x="117.5" y="277" font-size="21" text-anchor="middle">9</text><rect x="95.5" y="298" width="44" height="19" fill="white"/><text x="117.5" y="313" font-size="14" text-anchor="middle">i = 3</text><circle cx="292.5" cy="270" r="23" fill="#d5e9ff" stroke="#72899c" stroke-width="1.8"/><text x="292.5" y="277" font-size="21" text-anchor="middle">7</text><rect x="270.5" y="298" width="44" height="19" fill="white"/><text x="292.5" y="313" font-size="14" text-anchor="middle">i = 4</text><circle cx="467.5" cy="270" r="23" fill="#d5e9ff" stroke="#72899c" stroke-width="1.8"/><text x="467.5" y="277" font-size="21" text-anchor="middle">6</text><rect x="445.5" y="298" width="44" height="19" fill="white"/><text x="467.5" y="313" font-size="14" text-anchor="middle">i = 5</text><text x="24" y="405" font-size="19" text-anchor="start">Level-order array</text><text x="277.0" y="375" font-size="15" text-anchor="middle">0</text><rect x="250" y="385" width="54" height="44" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="277.0" y="414" font-size="22" text-anchor="middle">2</text><text x="338.0" y="375" font-size="15" text-anchor="middle">1</text><rect x="311" y="385" width="54" height="44" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="338.0" y="414" font-size="22" text-anchor="middle">5</text><text x="399.0" y="375" font-size="15" text-anchor="middle">2</text><rect x="372" y="385" width="54" height="44" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="399.0" y="414" font-size="22" text-anchor="middle">4</text><text x="460.0" y="375" font-size="15" text-anchor="middle">3</text><rect x="433" y="385" width="54" height="44" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="460.0" y="414" font-size="22" text-anchor="middle">9</text><text x="521.0" y="375" font-size="15" text-anchor="middle">4</text><rect x="494" y="385" width="54" height="44" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="521.0" y="414" font-size="22" text-anchor="middle">7</text><text x="582.0" y="375" font-size="15" text-anchor="middle">5</text><rect x="555" y="385" width="54" height="44" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="582.0" y