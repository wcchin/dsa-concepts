<svg xmlns="http://www.w3.org/2000/svg" width="870" height="450" viewBox="0 0 870 450" role="img" aria-labelledby="title desc"><title id="title">Independent heap invariant failures</title><desc id="desc">Left example has complete shape but parent4 greater than child3. Right example has ordered values but a missing left child before an occupied right position.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="24" text-anchor="start">A binary heap needs both shape and order</text><text x="24" y="85" font-size="20" text-anchor="start">Complete shape; broken order</text><path d="M210.0,168 L112.5,207" stroke="#70869a" stroke-width="2" fill="none"/><path d="M210.0,168 L307.5,207" stroke="#70869a" stroke-width="2" fill="none"/><path d="M112.5,253 L63.75,292" stroke="#70869a" stroke-width="2" fill="none"/><circle cx="210.0" cy="145" r="23" fill="#d5e9ff" stroke="#72899c" stroke-width="1.8"/><text x="210.0" y="152" font-size="21" text-anchor="middle">1</text><circle cx="112.5" cy="230" r="23" fill="#fbe0e0" stroke="#72899c" stroke-width="1.8"/><text x="112.5" y="237" font-size="21" text-anchor="middle">4</text><circle cx="307.5" cy="230" r="23" fill="#d5e9ff" stroke="#72899c" stroke-width="1.8"/><text x="307.5" y="237" font-size="21" text-anchor="middle">2</text><circle cx="63.75" cy="315" r="23" fill="#fbe0e0" stroke="#72899c" stroke-width="1.8"/><text x="63.75" y="322" font-size="21" text-anchor="middle">3</text><text x="450" y="85" font-size="20" text-anchor="start">Ordered edges; broken shape</text><circle cx="640" cy="145" r="23" fill="#d5e9ff" stroke="#72899c" stroke-width="1.8"/><text x="640" y="152" font-size="21" text-anchor="middle">1</text><path d="M640,168 L550,222" stroke="#70869a" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M640,168 L730,222" stroke="#70869a" stroke-width="2" fill="none"/><circle cx="730" cy="245" r="23" fill="#d5e9ff" stroke="#72899c" stroke-width="1.8"/><text x="730" y="252" font-size="21" text-anchor="middle">2</text><rect x="520" y="225" width="60" height="40" rx="5" fill="#ffffff" stroke="#8295a6"/><text x="550" y="252" font-size="18" text-anchor="middle">gap</text><text x="24" y="405" font-size="18" text-anchor="start">Parent 4 exceeds its child 3.</text><text x="450" y="405" font-size="17" text-anchor="start">The right child cannot precede the left slot.</text></g></svg>