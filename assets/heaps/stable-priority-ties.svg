<svg xmlns="http://www.w3.org/2000/svg" width="810" height="560" viewBox="0 0 810 560" role="img" aria-labelledby="title desc"><title id="title">Priority queue arrival-order tie breaking</title><desc id="desc">Entries priority sequence payload remove as B C D A. B and C tie at1; their sequence numbers1and2 decide the order.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="22" text-anchor="start">Stable ties: compare priority, then unique arrival sequence</text><text x="24" y="90" font-size="20" text-anchor="start">Arrivals</text><text x="430" y="90" font-size="20" text-anchor="start">Removal order</text><rect x="24" y="120" width="340" height="52" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="194" y="153" font-size="23" text-anchor="middle">(4, 0, A)</text><rect x="24" y="196" width="340" height="52" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="194" y="229" font-size="23" text-anchor="middle">(1, 1, B)</text><rect x="24" y="272" width="340" height="52" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="194" y="305" font-size="23" text-anchor="middle">(1, 2, C)</text><rect x="24" y="348" width="340" height="52" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="194" y="381" font-size="23" text-anchor="middle">(3, 3, D)</text><rect x="430" y="120" width="340" height="52" rx="5" fill="#d7f0e6" stroke="#8295a6"/><text x="600" y="153" font-size="23" text-anchor="middle">(1, 1, B)</text><rect x="430" y="196" width="340" height="52" rx="5" fill="#d7f0e6" stroke="#8295a6"/><text x="600" y="229" font-size="23" text-anchor="middle">(1, 2, C)</text><rect x="430" y="272" width="340" height="52" rx="5" fill="#eef1f5" stroke="#8295a6"/><text x="600" y="305" font-size="23" text-anchor="middle">(3, 3, D)</text><rect x="430" y="348" width="340" height="52" rx="5" fill="#eef1f5" stroke="#8295a6"/><text x="600" y="381" font-size="23" text-anchor="middle">(4, 0, A)</text><text x="24" y="480" font-size="18" text-anchor="start">B precedes C only because their priority ties and sequence 1 &lt; 2.</text><text x="24" y="525" font-size="18" text-anchor="start">The payload field need not be comparable when arrival sequences are unique.</text></g></svg>