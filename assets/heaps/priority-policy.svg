<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc"><title id="title">FIFO versus priority selection</title><desc id="desc">Arrivals A priority4, B priority1, C priority3. FIFO removes A B C, min-priority selection removes B C A.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="24" text-anchor="start">Same arrivals; different next-item rules</text><text x="24" y="125" font-size="19" text-anchor="start">Arrive in order</text><rect x="280" y="90" width="115" height="70" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="337" y="119" font-size="22" text-anchor="middle">A</text><text x="337" y="145" font-size="16" text-anchor="middle">priority 4</text><rect x="420" y="90" width="115" height="70" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="477" y="119" font-size="22" text-anchor="middle">B</text><text x="477" y="145" font-size="16" text-anchor="middle">priority 1</text><rect x="560" y="90" width="115" height="70" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="617" y="119" font-size="22" text-anchor="middle">C</text><text x="617" y="145" font-size="16" text-anchor="middle">priority 3</text><text x="24" y="275" font-size="19" text-anchor="start">FIFO removal</text><rect x="280" y="240" width="115" height="70" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="337" y="269" font-size="22" text-anchor="middle">A</text><text x="337" y="295" font-size="16" text-anchor="middle">priority 4</text><rect x="420" y="240" width="115" height="70" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="477" y="269" font-size="22" text-anchor="middle">B</text><text x="477" y="295" font-size="16" text-anchor="middle">priority 1</text><rect x="560" y="240" width="115" height="70" rx="5" fill="#d5e9ff" stroke="#8295a6"/><text x="617" y="269" font-size="22" text-anchor="middle">C</text><text x="617" y="295" font-size="16" text-anchor="middle">priority 3</text><text x="24" y="425" font-size="19" text-anchor="start">Min-priority removal</text><rect x="280" y="390" width="115" height="70" rx="5" fill="#d7f0e6" stroke="#8295a6"/><text x="337" y="419" font-size="22" text-anchor="middle">B</text><text x="337" y="445" font-size="16" text-anchor="middle">priority 1</text><rect x="420" y="390" width="115" height="70" rx="5" fill="#d7f0e6" stroke="#8295a6"/><text x="477" y="419" font-size="22" text-anchor="middle">C</text><text x="477" y="445" font-size="16" text-anchor="middle">priority 3</text><rect x="560" y="390" width="115" height="70" rx="5" fill="#d7f0e6" stroke="#8295a6"/><text x="617" y="419" font-size="22" text-anchor="middle">A</text><text x="617" y="445" font-size="16" text-anchor="middle">priority 4</text><text x="24" y="515" font-size="19" text-anchor="start">All three items are waiting before removals begin.</text></g></svg>