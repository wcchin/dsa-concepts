<svg xmlns="http://www.w3.org/2000/svg" width="850" height="635" viewBox="0 0 850 635" role="img" aria-labelledby="title desc"><title id="title">Kahn queue and output trace</title><desc id="desc">FIFO queue initially A B G gives topological order A B G C D E F.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Kahn: the ready queue uses remaining indegrees</text><text x="24" y="85" font-size="18" text-anchor="start">Removed</text><text x="220" y="85" font-size="18" text-anchor="start">Ready queue afterwards</text><text x="500" y="85" font-size="18" text-anchor="start">Output</text><text x="24" y="136" font-size="19" text-anchor="start">Initial</text><rect x="210" y="110" width="245" height="39" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="225" y="136" font-size="19" text-anchor="start">A, B, G</text><text x="500" y="136" font-size="19" text-anchor="start"></text><text x="24" y="191" font-size="19" text-anchor="start">A</text><rect x="210" y="165" width="245" height="39" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="225" y="191" font-size="19" text-anchor="start">B, G</text><text x="500" y="191" font-size="19" text-anchor="start">A</text><text x="24" y="246" font-size="19" text-anchor="start">B</text><rect x="210" y="220" width="245" height="39" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="225" y="246" font-size="19" text-anchor="start">G, C, D</text><text x="500" y="246" font-size="19" text-anchor="start">A, B</text><text x="24" y="301" font-size="19" text-anchor="start">G</text><rect x="210" y="275" width="245" height="39" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="225" y="301" font-size="19" text-anchor="start">C, D</text><text x="500" y="301" font-size="19" text-anchor="start">A, B, G</text><text x="24" y="356" font-size="19" text-anchor="start">C</text><rect x="210" y="330" width="245" height="39" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="225" y="356" font-size="19" text-anchor="start">D</text><text x="500" y="356" font-size="19" text-anchor="start">A, B, G, C</text><text x="24" y="411" font-size="19" text-anchor="start">D</text><rect x="210" y="385" width="245" height="39" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="225" y="411" font-size="19" text-anchor="start">E</text><text x="500" y="411" font-size="19" text-anchor="start">A, B, G, C, D</text><text x="24" y="466" font-size="19" text-anchor="start">E</text><rect x="210" y="440" width="245" height="39" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="225" y="466" font-size="19" text-anchor="start">F</text><text x="500" y="466" font-size="19" text-anchor="start">A, B, G, C, D, E</text><text x="24" y="521" font-size="19" text-anchor="start">F</text><rect x="210" y="495" width="245" height="39" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="225" y="521" font-size="19" text-anchor="start">empty</text><text x="500" y="521" font-size="19" text-anchor="start">A, B, G, C, D, E, F</text><text x="24" y="600" font-size="18" text-anchor="start">FIFO preserves readiness order; it does not impose global alphabetical order.</text></g></svg>