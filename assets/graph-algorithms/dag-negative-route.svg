<svg xmlns="http://www.w3.org/2000/svg" width="810" height="480" viewBox="0 0 810 480" role="img" aria-labelledby="title desc"><title id="title">A negative-edge acyclic shortest path</title><desc id="desc">A B weight2, A C weight5, C B weightminus4. Process A C B to obtain distance1 to B.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Negative-edge DAG: process A, then C, then B</text><path d="M115.0,205.0 L643.0,205.0" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="360.0" y="189.0" width="40" height="28" rx="5" fill="#ffffff" stroke="#8196a7"/><text x="380.0" y="210.0" font-size="18" text-anchor="middle">2</text><path d="M113.1523089942387,195.567577817162 L334.9955062862222,105.18701595746502" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="205.0" y="134.0" width="40" height="28" rx="5" fill="#ffffff" stroke="#8196a7"/><text x="225.0" y="155.0" font-size="18" text-anchor="middle">5</text><path d="M383.56069363703114,103.36024612926911 L644.5544508720063,195.97093418038935" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="495.0" y="134.0" width="40" height="28" rx="5" fill="#ffffff" stroke="#8196a7"/><text x="515.0" y="155.0" font-size="18" text-anchor="middle">−4</text><circle cx="90" cy="205" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="90" y="212" font-size="21" text-anchor="middle">A</text><circle cx="360" cy="95" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="360" y="102" font-size="21" text-anchor="middle">C</text><circle cx="670" cy="205" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="670" y="212" font-size="21" text-anchor="middle">B</text><text x="24" y="340" font-size="20" text-anchor="start">After A: B = 2, C = 5</text><text x="24" y="385" font-size="20" text-anchor="start">After C: B improves to 5 − 4 = 1</text><text x="24" y="445" font-size="18" text-anchor="start">Topological order, rather than smallest tentative distance, justifies processing.</text></g></svg>