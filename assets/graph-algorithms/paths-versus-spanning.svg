<svg xmlns="http://www.w3.org/2000/svg" width="880" height="455" viewBox="0 0 880 455" role="img" aria-labelledby="title desc"><title id="title">Shortest-path tree versus minimum spanning tree</title><desc id="desc">Shortest-path tree from A takes both weight2 edges. An MST takes AB2 and BC1, reducing total but lengthening route to C.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="24" text-anchor="start">Two objectives on the same weighted triangle</text><text x="24" y="80" font-size="19" text-anchor="start">Shortest-path tree from A</text><path d="M195.36273615389103,150.26698070999703 L95.80824495379768,288.1116608332032" stroke="#248a72" stroke-width="2" fill="none"/><rect x="125.0" y="204.0" width="40" height="28" rx="5" fill="#ffffff" stroke="#8196a7"/><text x="145.0" y="225.0" font-size="18" text-anchor="middle">2</text><path d="M224.63726384610897,150.26698070999703 L324.19175504620233,288.1116608332032" stroke="#248a72" stroke-width="2" fill="none"/><rect x="255.0" y="204.0" width="40" height="28" rx="5" fill="#ffffff" stroke="#8196a7"/><text x="275.0" y="225.0" font-size="18" text-anchor="middle">2</text><path d="M105.0,310.0 L313.0,310.0" stroke="#71889b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><rect x="190.0" y="294.0" width="40" height="28" rx="5" fill="#ffffff" stroke="#8196a7"/><text x="210.0" y="315.0" font-size="18" text-anchor="middle">1</text><circle cx="210" cy="130" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="210" y="137" font-size="21" text-anchor="middle">A</text><circle cx="80" cy="310" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="80" y="317" font-size="21" text-anchor="middle">B</text><circle cx="340" cy="310" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="340" y="317" font-size="21" text-anchor="middle">C</text><text x="24" y="410" font-size="17" text-anchor="start">Distances to B and C: 2 each; edge sum 4</text><text x="459" y="80" font-size="19" text-anchor="start">One minimum spanning tree</text><path d="M630.3627361538911,150.26698070999703 L530.8082449537977,288.1116608332032" stroke="#248a72" stroke-width="2" fill="none"/><rect x="560.0" y="204.0" width="40" height="28" rx="5" fill="#ffffff" stroke="#8196a7"/><text x="580.0" y="225.0" font-size="18" text-anchor="middle">2</text><path d="M659.6372638461089,150.26698070999703 L759.1917550462023,288.1116608332032" stroke="#71889b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><rect x="690.0" y="204.0" width="40" height="28" rx="5" fill="#ffffff" stroke="#8196a7"/><text x="710.0" y="225.0" font-size="18" text-anchor="middle">2</text><path d="M540.0,310.0 L748.0,310.0" stroke="#248a72" stroke-width="2" fill="none"/><rect x="625.0" y="294.0" width="40" height="28" rx="5" fill="#ffffff" stroke="#8196a7"/><text x="645.0" y="315.0" font-size="18" text-anchor="middle">1</text><circle cx="645" cy="130" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="645" y="137" font-size="21" text-anchor="middle">A</text><circle cx="515" cy="310" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="515" y="317" font-size="21" text-anchor="middle">B</text><circle cx="775" cy="310" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="775" y="317" font-size="21" text-anchor="middle">C</text><text x="459" y="410" font-size="17" text-anchor="start">Edge sum 3; route A–B–C costs 3</text></g></svg>