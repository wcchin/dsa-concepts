<svg xmlns="http://www.w3.org/2000/svg" width="820" height="465" viewBox="0 0 820 465" role="img" aria-labelledby="title desc"><title id="title">The shared prerequisite DAG</title><desc id="desc">Edges A C, B C, B D, C E, D E, E F are directed. G is isolated.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Dependencies point from prerequisites to successors</text><path d="M105.0,110.0 L273.0,110.0" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M98.49850183489859,293.1831801500922 L280.02161801830954,128.16216543790043" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M105.0,310.0 L273.0,310.0" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M322.9267514063309,119.96815278536126 L505.23910848116265,199.23439499180984" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M322.9267514063309,300.03184721463873 L505.23910848116265,220.76560500819016" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M555.0,210.0 L703.0,210.0" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><circle cx="80" cy="110" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="80" y="117" font-size="21" text-anchor="middle">A</text><circle cx="80" cy="310" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="80" y="317" font-size="21" text-anchor="middle">B</text><circle cx="300" cy="110" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="300" y="117" font-size="21" text-anchor="middle">C</text><circle cx="300" cy="310" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="300" y="317" font-size="21" text-anchor="middle">D</text><circle cx="530" cy="210" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="530" y="217" font-size="21" text-anchor="middle">E</text><circle cx="730" cy="210" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="730" y="217" font-size="21" text-anchor="middle">F</text><circle cx="730" cy="90" r="23" fill="#ffe5c5" stroke="#6f899e" stroke-width="1.8"/><text x="730" y="97" font-size="21" text-anchor="middle">G</text><text x="24" y="425" font-size="19" text-anchor="start">G is independent but still belongs in a complete topological order.</text></g></svg>