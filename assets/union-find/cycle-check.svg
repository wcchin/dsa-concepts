<svg xmlns="http://www.w3.org/2000/svg" width="850" height="485" viewBox="0 0 850 485" role="img" aria-labelledby="title desc"><title id="title">Union-find detects a redundant undirected edge</title><desc id="desc">Accepted edges0 1 and1 2 connect all three vertices. Candidate0 2 would form a triangle and is rejected.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">A new edge within one component closes a cycle</text><path d="M185.0,120.0 L403.0,120.0" stroke="#248a72" stroke-width="2" fill="none"/><path d="M430.0,145.0 L430.0,323.0" stroke="#248a72" stroke-width="2" fill="none"/><path d="M179.0310807621678,136.2116613899948 L409.4464327768588,332.49140569880564" stroke="#c37d2b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><circle cx="160" cy="120" r="23" fill="#d7f0e6" stroke="#6f899e" stroke-width="1.8"/><text x="160" y="127" font-size="21" text-anchor="middle">0</text><circle cx="430" cy="120" r="23" fill="#d7f0e6" stroke="#6f899e" stroke-width="1.8"/><text x="430" y="127" font-size="21" text-anchor="middle">1</text><circle cx="430" cy="350" r="23" fill="#d7f0e6" stroke="#6f899e" stroke-width="1.8"/><text x="430" y="357" font-size="21" text-anchor="middle">2</text><text x="550" y="135" font-size="19" text-anchor="start">Accept 0–1: merge</text><text x="550" y="190" font-size="19" text-anchor="start">Accept 1–2: merge</text><text x="550" y="245" font-size="19" text-anchor="start">Reject 0–2: same set</text><text x="24" y="445" font-size="18" text-anchor="start">The chosen graph edges and union-find parent pointers are different records.</text></g></svg>