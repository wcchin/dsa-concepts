<svg xmlns="http://www.w3.org/2000/svg" width="840" height="370" viewBox="0 0 840 370" role="img" aria-labelledby="title desc"><title id="title">A partition into disjoint sets</title><desc id="desc">Members0 1 2 3 form one group,4 5 another,6 a singleton. Representatives chosen0 4 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="24" text-anchor="start">One universe, three disjoint sets</text><rect x="25" y="100" width="430" height="145" rx="5" fill="#d7f0e6" stroke="#8196a7"/><circle cx="70" cy="160" r="23" fill="#ffe5c5" stroke="#6f899e" stroke-width="1.8"/><text x="70" y="167" font-size="21" text-anchor="middle">0</text><circle cx="170" cy="160" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="170" y="167" font-size="21" text-anchor="middle">1</text><circle cx="270" cy="160" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="270" y="167" font-size="21" text-anchor="middle">2</text><circle cx="370" cy="160" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="370" y="167" font-size="21" text-anchor="middle">3</text><text x="240.0" y="220" font-size="16" text-anchor="middle">representative 0</text><rect x="480" y="100" width="190" height="145" rx="5" fill="#d7f0e6" stroke="#8196a7"/><circle cx="525" cy="160" r="23" fill="#ffe5c5" stroke="#6f899e" stroke-width="1.8"/><text x="525" y="167" font-size="21" text-anchor="middle">4</text><circle cx="625" cy="160" r="23" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="625" y="167" font-size="21" text-anchor="middle">5</text><text x="575.0" y="220" font-size="16" text-anchor="middle">representative 4</text><rect x="695" y="100" width="100" height="145" rx="5" fill="#d7f0e6" stroke="#8196a7"/><circle cx="740" cy="160" r="23" fill="#ffe5c5" stroke="#6f899e" stroke-width="1.8"/><text x="740" y="167" font-size="21" text-anchor="middle">6</text><text x="745.0" y="220" font-size="16" text-anchor="middle">root 6</text><text x="24" y="330" font-size="19" text-anchor="start">Every member appears once. Representatives identify groups, not routes.</text></g></svg>