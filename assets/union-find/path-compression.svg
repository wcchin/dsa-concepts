<svg xmlns="http://www.w3.org/2000/svg" width="880" height="590" viewBox="0 0 880 590" role="img" aria-labelledby="title desc"><title id="title">Compression of the path from3 to0</title><desc id="desc">Before find3, parent3 is2. Afterwards parent3 is0. Parent5 remains4 and groups do not change.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Path compression changes shape, not membership</text><text x="24" y="80" font-size="20" text-anchor="start">Before find(3)</text><text x="455" y="80" font-size="20" text-anchor="start">After find(3)</text><path d="M60,221 L170,149" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M170,221 L170,149" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M170,326 L170,259" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M280,221 L170,149" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M280,326 L280,259" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><circle cx="170" cy="130" r="19" fill="#d7f0e6" stroke="#6f899e" stroke-width="1.8"/><text x="170" y="137" font-size="21" text-anchor="middle">0</text><circle cx="60" cy="240" r="19" fill="#d5e9ff" stroke="#6f899e" stroke-width="1.8"/><text x="60" y="247" font-size="21" text-anchor="middle">1</text><circle cx="170" cy="240" r="19" fill="#ffe5c5" stroke="#6f899e" stroke-width="1.8"/><text x="170" y="247" font-size="21" text-anchor="middle">2</text><circle cx="170" cy="345" r="19" fill="#ffe5c5" stroke="#6f899e" stroke-width="1.8"/><text x="170" y="352" font-size="21" text-anchor="middle">3</text><circle cx="280" cy="240" r="19" fill="#d5e9ff" stroke="#6f899e" stro