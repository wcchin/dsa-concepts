<svg xmlns="http://www.w3.org/2000/svg" width="800" height="415" viewBox="0 0 800 415" role="img" aria-labelledby="title desc"><title id="title">AVL height and balance metadata</title><desc id="desc">Root 30 has height two and factor plus one. Its left child 20 has leaves 10 and 25; right child 40 is a leaf.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="22" text-anchor="start">Stored height h; balance factor BF = h(left) − h(right)</text><path d="M390.0,114 L205.0,161" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M205.0,209 L112.5,256" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M205.0,209 L297.5,256" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M390.0,114 L575.0,161" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="390.0" cy="90" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="390.0" y="96" font-size="18" text-anchor="middle">30</text><rect x="350.0" y="120" width="80" height="19" fill="white"/><text x="390.0" y="135" font-size="14" text-anchor="middle">h=2, BF=+1</text><circle cx="205.0" cy="185" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="205.0" y="191" font-size="18" text-anchor="middle">20</text><rect x="168.5" y="215" width="73" height="19" fill="white"/><text x="205.0" y="230" font-size="14" text-anchor="middle">h=1, BF=0</text><circle cx="112.5" cy="280" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="112.5" y="286" font-size="18" text-anchor="middle">10</text><rect x="76.0" y="310" width="73" height="19" fill="white"/><text x="112.5" y="325" font-size="14" text-anchor="middle">h=0, BF=0</text><circle cx="297.5" cy="280" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="297.5" y="286" font-size="18" text-anchor="middle">25</text><rect x="261.0" y="310" width="73" height="19" fill="white"/><text x="297.5" y="325" font-size="14" text-anchor="middle">h=0, BF=0</text><circle cx="575.0" cy="185" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="575.0" y="191" font-size="18" text-anchor="middle">40</text><rect x="538.5" y="215" width="73" height="19" fill="white"/><text x="575.0" y="230" font-size="14" text-anchor="middle">h=0, BF=0</text><text x="24" y="380" font-size="18" text-anchor="start">Empty child: h = −1. Every node, not only the root, must be balanced.</text></g></svg>