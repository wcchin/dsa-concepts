<svg xmlns="http://www.w3.org/2000/svg" width="880" height="465" viewBox="0 0 880 465" role="img" aria-labelledby="title desc"><title id="title">Deletion with a zero-factor heavy child</title><desc id="desc">After deleting 5 from root 4 with left subtree 2 1 3, right rotation promotes 2 and retains 3 as 4.left.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Deletion: a zero-factor heavy child uses one rotation</text><text x="24" y="80" font-size="20" text-anchor="start">After removing 5</text><path d="M215.0,159 L115.0,196" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M115.0,244 L65.0,281" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M115.0,244 L165.0,281" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="215.0" cy="135" r="24" fill="#fbe0e0" stroke="#72899b" stroke-width="1.8"/><text x="215.0" y="141" font-size="18" text-anchor="middle">4</text><rect x="192.5" y="165" width="45" height="19" fill="white"/><text x="215.0" y="180" font-size="14" text-anchor="middle">BF=+2</text><circle cx="115.0" cy="220" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="115.0" y="226" font-size="18" text-anchor="middle">2</text><rect x="96.0" y="250" width="38" height="19" fill="white"/><text x="115.0" y="265" font-size="14" text-anchor="middle">BF=0</text><circle cx="65.0" cy="305" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="65.0" y="311" font-size="18" text-anchor="middle">1</text><circle cx="165.0" cy="305" r="24" fill="#ffe5c5" stroke="#72899b" stroke-width="1.8"/><text x="165.0" y="311" font-size="18" text-anchor="middle">3</text><text x="450" y="80" font-size="20" text-anchor="start">After right rotation at 4</text><path d="M645.0,159 L545.0,196" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M645.0,159 L745.0,196" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M745.0,244 L695.0,281" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="645.0" cy="135" r="24" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="645.0" y="141" font-size="18" text-anchor="middle">2</text><circle cx="545.0" cy="220" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="545.0" y="226" font-size="18" text-anchor="middle">1</text><circle cx="745.0" cy="220" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="745.0" y="226" font-size="18" text-anchor="middle">4</text><circle cx="695.0" cy="305" r="24" fill="#ffe5c5" stroke="#72899b" stroke-width="1.8"/><text x="695.0" y="311" font-size="18" text-anchor="middle">3</text><text x="24" y="430" font-size="19" text-anchor="start">Middle subtree 3 becomes 4.left. All heights must be refreshed.</text></g></svg>