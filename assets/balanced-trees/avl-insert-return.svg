<svg xmlns="http://www.w3.org/2000/svg" width="850" height="465" viewBox="0 0 850 465" role="img" aria-labelledby="title desc"><title id="title">Bottom-up LR insertion repair</title><desc id="desc">New leaf 20 makes root 30 unbalanced. Checking 10 before 30 supplies valid child heights; two rotations produce root 20.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Insert 20: check and repair on the return path</text><path d="M195.0,139 L107.5,176" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M107.5,224 L151.25,261" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="195.0" cy="115" r="24" fill="#fbe0e0" stroke="#72899b" stroke-width="1.8"/><text x="195.0" y="121" font-size="18" text-anchor="middle">30</text><rect x="144.5" y="145" width="101" height="19" fill="white"/><text x="195.0" y="160" font-size="14" text-anchor="middle">BF=+2: repair</text><circle cx="107.5" cy="200" r="24" fill="#ffe5c5" stroke="#72899b" stroke-width="1.8"/><text x="107.5" y="206" font-size="18" text-anchor="middle">10</text><rect x="60.5" y="230" width="94" height="19" fill="white"/><text x="107.5" y="245" font-size="14" text-anchor="middle">BF=−1: valid</text><circle cx="151.25" cy="285" r="24" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="151.25" y="291" font-size="18" text-anchor="middle">20</text><path d="M635.0,139 L547.5,176" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M635.0,139 L722.5,176" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="635.0" cy="115" r="24" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="635.0" y="121" font-size="18" text-anchor="middle">20</text><circle cx="547.5" cy="200" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="547.5" y="206" font-size="18" text-anchor="middle">10</text><circle cx="722.5" cy="200" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="722.5" y="206" font-size="18" text-anchor="middle">30</text><text x="24" y="385" font-size="19" text-anchor="start">Visit the leaf, check 10, then repair the LR imbalance at 30.</text><text x="24" y="430" font-size="20" text-anchor="start">Return the new root 20; the caller reconnects it.</text></g></svg>