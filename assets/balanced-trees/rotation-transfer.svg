<svg xmlns="http://www.w3.org/2000/svg" width="880" height="475" viewBox="0 0 880 475" role="img" aria-labelledby="title desc"><title id="title">A right rotation transfers the middle subtree</title><desc id="desc">Promote 30 above 50, transfer 40 to 50.left, retain 20 and 70. Inorder is unchanged.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="32" font-size="23" text-anchor="start">Right rotation: the middle subtree must survive</text><text x="24" y="80" font-size="20" text-anchor="start">Before</text><text x="465" y="80" font-size="20" text-anchor="start">After</text><path d="M215.0,149 L115.0,186" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M115.0,234 L65.0,271" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M115.0,234 L165.0,271" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M215.0,149 L315.0,186" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="215.0" cy="125" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="215.0" y="131" font-size="18" text-anchor="middle">50</text><circle cx="115.0" cy="210" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="115.0" y="216" font-size="18" text-anchor="middle">30</text><circle cx="65.0" cy="295" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="65.0" y="301" font-size="18" text-anchor="middle">20</text><circle cx="165.0" cy="295" r="24" fill="#ffe5c5" stroke="#72899b" stroke-width="1.8"/><text x="165.0" y="301" font-size="18" text-anchor="middle">40</text><circle cx="315.0" cy="210" r="24" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="315.0" y="216" font-size="18" text-anchor="middle">70</text><path d="M645.0,149 L545.0,186" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M645.0,149 L745.0,186" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M745.0,234 L695.0,271" stroke="#647c8f" stroke-width="2" fill="none"/><path d="M745.0,234 L795.0,271" stroke="#647c8f" stroke-width="2" fill="none"/><circle cx="645.0" cy="125" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="645.0" y="131" font-size="18" text-anchor="middle">30</text><circle cx="545.0" cy="210" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="545.0" y="216" font-size="18" text-anchor="middle">20</text><circle cx="745.0" cy="210" r="24" fill="#d5e9ff" stroke="#72899b" stroke-width="1.8"/><text x="745.0" y="216" font-size="18" text-anchor="middle">50</text><circle cx="695.0" cy="295" r="24" fill="#ffe5c5" stroke="#72899b" stroke-width="1.8"/><text x="695.0" y="301" font-size="18" text-anchor="middle">40</text><circle cx="795.0" cy="295" r="24" fill="#d7f0e6" stroke="#72899b" stroke-width="1.8"/><text x="795.0" y="301" font-size="18" text-anchor="middle">70</text><text x="24" y="400" font-size="19" text-anchor="start">30.right becomes 50.left: key 40 remains between 30 and 50.</text><text x="24" y="440" font-size="20" text-anchor="start">Inorder before and after: 20, 30, 40, 50, 70</text></g></svg>