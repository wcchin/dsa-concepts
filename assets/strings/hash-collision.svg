<svg xmlns="http://www.w3.org/2000/svg" width="850" height="535" viewBox="0 0 850 535" role="img" aria-labelledby="title desc"><title id="title">A deliberate rolling-hash collision</title><desc id="desc">With base10 and modulus7, ab and ai both hash to4, but character verification rejects ai as a match for ab.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" text-anchor="start" fill="#182f49">Same fingerprint does not establish equal strings</text><rect x="30" y="120" width="130" height="62" rx="6" fill="#d5e9ff" stroke="#8297aa"/><text x="95" y="161" font-size="29" text-anchor="middle" fill="#182f49">ab</text><text x="195" y="160" font-size="22" text-anchor="start" fill="#182f49">97 × 10 + 98 = 1068</text><rect x="640" y="120" width="150" height="62" rx="6" fill="#ffe5c5" stroke="#8297aa"/><text x="715" y="161" font-size="21" text-anchor="middle" fill="#182f49">mod 7 = 4</text><rect x="30" y="270" width="130" height="62" rx="6" fill="#d5e9ff" stroke="#8297aa"/><text x="95" y="311" font-size="29" text-anchor="middle" fill="#182f49">ai</text><text x="195" y="310" font-size="22" text-anchor="start" fill="#182f49">97 × 10 + 105 = 1075</text><rect x="640" y="270" width="150" height="62" rx="6" fill="#ffe5c5" stroke="#8297aa"/><text x="715" y="311" font-size="21" text-anchor="middle" fill="#182f49">mod 7 = 4</text><text x="24" y="425" font-size="22" text-anchor="start" fill="#182f49">Verification compares the actual symbols: b ≠ i, so reject.</text><text x="24" y="490" font-size="19" text-anchor="start" fill="#182f49">A fixed fingerprint is a filter; exact comparison protects correctness.</text></g></svg>