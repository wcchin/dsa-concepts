<svg xmlns="http://www.w3.org/2000/svg" width="850" height="540" viewBox="0 0 850 540" role="img" aria-labelledby="title desc"><title id="title">A rolling polynomial hash update</title><desc id="desc">Toy codes1 2 3 roll to2 3 4. In base10 modulo101, the hash changes from22 to32.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" text-anchor="start" fill="#182f49">Roll a length-three polynomial window</text><text x="24" y="90" font-size="20" text-anchor="start" fill="#182f49">Toy code values; base 10, modulus 101</text><rect x="150" y="140" width="118" height="52" rx="6" fill="#ffe5c5" stroke="#8297aa"/><text x="209.0" y="174" font-size="23" text-anchor="middle" fill="#182f49">1</text><rect x="275" y="140" width="118" height="52" rx="6" fill="#d5e9ff" stroke="#8297aa"/><text x="334.0" y="174" font-size="23" text-anchor="middle" fill="#182f49">2</text><rect x="400" y="140" width="118" height="52" rx="6" fill="#d5e9ff" stroke="#8297aa"/><text x="459.0" y="174" font-size="23" text-anchor="middle" fill="#182f49">3</text><rect x="525" y="140" width="118" height="52" rx="6" fill="#d7f0e6" stroke="#8297aa"/><text x="584.0" y="174" font-size="23" text-anchor="middle" fill="#182f49">4</text><text x="24" y="285" font-size="22" text-anchor="start" fill="#182f49">Old window [1,2,3]: 123 mod 101 = 22</text><text x="24" y="345" font-size="22" text-anchor="start" fill="#182f49">New window [2,3,4]: 234 mod 101 = 32</text><text x="24" y="415" font-size="22" text-anchor="start" fill="#182f49">Update: ((22 − 1 × 100) × 10 + 4) mod 101 = 32</text><text x="24" y="490" font-size="20" text-anchor="start" fill="#182f49">Remove outgoing × high power, shift, then add incoming.</text></g></svg>