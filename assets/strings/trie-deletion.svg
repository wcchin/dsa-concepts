<svg xmlns="http://www.w3.org/2000/svg" width="920" height="545" viewBox="0 0 920 545" role="img" aria-labelledby="title desc"><title id="title">Terminal clearing versus suffix pruning</title><desc id="desc">Deleting bus retains its descendants. Independently deleting buses prunes nodes buse and buses and retains bus and busy.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" text-anchor="start" fill="#182f49">Two independent deletions from the original trie</text><text x="20" y="95" font-size="18" text-anchor="start" fill="#182f49">Delete bus: clear its terminal flag</text><path d="M190,210 L100,280" stroke="#71889b" stroke-width="2" fill="none"/><text x="155.0" y="245.0" font-size="19" text-anchor="start" fill="#182f49">e</text><path d="M190,210 L320,280" stroke="#71889b" stroke-width="2" fill="none"/><text x="265.0" y="245.0" font-size="19" text-anchor="start" fill="#182f49">y</text><path d="M100,330 L100,400" stroke="#71889b" stroke-width="2" fill="none"/><text x="110.0" y="365.0" font-size="19" text-anchor="start" fill="#182f49">s</text><rect x="148" y="160" width="84" height="50" rx="6" fill="#d5e9ff" stroke="#8297aa"/><text x="190" y="192" font-size="19" text-anchor="middle" fill="#182f49">bus</text><rect x="58" y="280" width="84" height="50" rx="6" fill="#d5e9ff" stroke="#8297aa"/><text x="100" y="312" font-size="19" text-anchor="middle" fill="#182f49">buse</text><rect x="278" y="280" width="84" height="50" rx="6" fill="#d7f0e6" stroke="#8297aa"/><text x="320" y="312" font-size="19" text-anchor="middle" fill="#182f49">busy</text><rect x="58" y="400" width="84" height="50" rx="6" fill="#d7f0e6" stroke="#8297aa"/><text x="100" y="432" font-size="19" text-anchor="middle" fill="#182f49">buses</text><text x="20" y="500" font-size="18" text-anchor="start" fill="#182f49">Keep all nodes needed by other keys.</text><text x="480" y="95" font-size="18" text-anchor="start" fill="#182f49">Delete buses: prune unused e and s</text><path d="M650,210 L560,280" stroke="#71889b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="615.0" y="245.0" font-size="19" text-anchor="start" fill="#182f49">e</text><path d="M650,210 L780,280" stroke="#71889b" stroke-width="2" fill="none"/><text x="725.0" y="245.0" font-size="19" text-anchor="start" fill="#182f49">y</text><path d="M560,330 L560,400" stroke="#71889b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="570.0" y="365.0" font-size="19" text-anchor="start" fill="#182f49">s</text><rect x="608" y="160" width="84" height="50" rx="6" fill="#d7f0e6" stroke="#8297aa"/><text x="650" y="192" font-size="19" text-anchor="middle" fill="#182f49">bus</text><rect x="518" y="280" width="84" height="50" rx="6" fill="#eef1f5" stroke="#8297aa"/><text x="560" y="312" font-size="19" text-anchor="middle" fill="#182f49">buse</text><rect x="738" y="280" width="84" height="50" rx="6" fill="#d7f0e6" stroke="#8297aa"/><text x="780" y="312" font-size="19" text-anchor="middle" fill="#182f49">busy</text><rect x="518" y="400" width="84" height="50" rx="6" fill="#eef1f5" stroke="#8297aa"/><text x="560" y="432" font-size="19" text-anchor="middle" fill="#182f49">buses</text><text x="480" y="500" font-size="18" text-anchor="start" fill="#182f49">Grey nodes are removed; busy remains.</text></g></svg>