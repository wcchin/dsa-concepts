<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc"><title id="title">Prefix, substring and subsequence in minibus</title><desc id="desc">Minibus has prefix mini and substring bus starting at4. Bs skips u and is only a subsequence.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="36" font-size="25" text-anchor="start" fill="#182f49">Different relations ask different search questions</text><rect x="125" y="120" width="81" height="52" rx="6" fill="#d5e9ff" stroke="#8297aa"/><text x="165.5" y="154" font-size="23" text-anchor="middle" fill="#182f49">m</text><rect x="213" y="120" width="81" height="52" rx="6" fill="#d5e9ff" stroke="#8297aa"/><text x="253.5" y="154" font-size="23" text-anchor="middle" fill="#182f49">i</text><rect x="301" y="120" width="81" height="52" rx="6" fill="#d5e9ff" stroke="#8297aa"/><text x="341.5" y="154" font-size="23" text-anchor="middle" fill="#182f49">n</text><rect x="389" y="120" width="81" height="52" rx="6" fill="#d5e9ff" stroke="#8297aa"/><text x="429.5" y="154" font-size="23" text-anchor="middle" fill="#182f49">i</text><rect x="477" y="120" width="81" height="52" rx="6" fill="#d7f0e6" stroke="#8297aa"/><text x="517.5" y="154" font-size="23" text-anchor="middle" fill="#182f49">b</text><rect x="565" y="120" width="81" height="52" rx="6" fill="#d7f0e6" stroke="#8297aa"/><text x="605.5" y="154" font-size="23" text-anchor="middle" fill="#182f49">u</text><rect x="653" y="120" width="81" height="52" rx="6" fill="#d7f0e6" stroke="#8297aa"/><text x="693.5" y="154" font-size="23" text-anchor="middle" fill="#182f49">s</text><text x="165" y="100" font-size="17" text-anchor="middle" fill="#182f49">0</text><text x="253" y="100" font-size="17" text-anchor="middle" fill="#182f49">1</text><text x="341" y="100" font-size="17" text-anchor="middle" fill="#182f49">2</text><text x="429" y="100" font-size="17" text-anchor="middle" fill="#182f49">3</text><text x="517" y="100" font-size="17" text-anchor="middle" fill="#182f49">4</text><text x="605" y="100" font-size="17" text-anchor="middle" fill="#182f49">5</text><text x="693" y="100" font-size="17" text-anchor="middle" fill="#182f49">6</text><text x="24" y="235" font-size="22" text-anchor="start" fill="#182f49">Prefix: mini</text><path d="M127,187 L461,187" stroke="#248a72" stroke-width="2" fill="none"/><text x="24" y="300" font-size="22" text-anchor="start" fill="#182f49">Substring: bus starts at index 4</text><text x="24" y="365" font-size="22" text-anchor="start" fill="#182f49">Subsequence: b then s can skip u</text><text x="24" y="430" font-size="19" text-anchor="start" fill="#182f49">Every prefix is a substring; a subsequence need not be contiguous.</text></g></svg>