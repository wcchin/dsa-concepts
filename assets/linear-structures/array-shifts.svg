<svg xmlns="http://www.w3.org/2000/svg" width="700" height="405" viewBox="0 0 700 405" role="img" aria-labelledby="title desc"><title id="title">Array insertion and removal</title><desc id="desc">Insertion of X at index one shifts D C B right in that order. Removal of X shifts B C D left.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="23" text-anchor="start">Insert by shifting right; remove by shifting left</text><text x="22" y="95" font-size="18" text-anchor="start">Start: length 4</text><rect x="300" y="65" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="332.0" y="95.0" font-size="21" text-anchor="middle">A</text><rect x="372" y="65" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="404.0" y="95.0" font-size="21" text-anchor="middle">B</text><rect x="444" y="65" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="476.0" y="95.0" font-size="21" text-anchor="middle">C</text><rect x="516" y="65" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="548.0" y="95.0" font-size="21" text-anchor="middle">D</text><rect x="588" y="65" width="64" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="620.0" y="95.0" font-size="21" text-anchor="middle">spare</text><text x="24" y="165" font-size="19" text-anchor="start">Insert X at position 1</text><text x="300" y="165" font-size="18" text-anchor="start">Move D, then C, then B right.</text><text x="22" y="225" font-size="18" text-anchor="start">After insertion</text><rect x="300" y="195" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="332.0" y="225.0" font-size="21" text-anchor="middle">A</text><rect x="372" y="195" width="64" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="404.0" y="225.0" font-size="21" text-anchor="middle">X</text><rect x="444" y="195" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="476.0" y="225.0" font-size="21" text-anchor="middle">B</text><rect x="516" y="195" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="548.0" y="225.0" font-size="21" text-anchor="middle">C</text><rect x="588" y="195" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="620.0" y="225.0" font-size="21" text-anchor="middle">D</text><text x="24" y="295" font-size="19" text-anchor="start">Remove position 1</text><text x="300" y="295" font-size="18" text-anchor="start">Move B, then C, then D left.</text><text x="22" y="355" font-size="18" text-anchor="start">After removal</text><rect x="300" y="325" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="332.0" y="355.0" font-size="21" text-anchor="middle">A</text><rect x="372" y="325" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="404.0" y="355.0" font-size="21" text-anchor="middle">B</text><rect x="444" y="325" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="476.0" y="355.0" font-size="21" text-anchor="middle">C</text><rect x="516" y="325" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="548.0" y="355.0" font-size="21" text-anchor="middle">D</text><rect x="588" y="325" width="64" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="620.0" y="355.0" font-size="21" text-anchor="middle">spare</text></g></svg>