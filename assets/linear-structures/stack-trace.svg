<svg xmlns="http://www.w3.org/2000/svg" width="700" height="455" viewBox="0 0 700 455" role="img" aria-labelledby="title desc"><title id="title">A LIFO stack trace</title><desc id="desc">Pushing A B C, popping C, and pushing D leaves A B D. The top is always the rightmost occupied position.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="23" text-anchor="start">Stack operations: bottom on the left, top on the right</text><text x="22" y="95" font-size="18" text-anchor="start">push(A)</text><rect x="235" y="65" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="267.0" y="95.0" font-size="21" text-anchor="middle">A</text><text x="525" y="94" font-size="18" text-anchor="start"></text><text x="22" y="162" font-size="18" text-anchor="start">push(B)</text><rect x="235" y="132" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="267.0" y="162.0" font-size="21" text-anchor="middle">A</text><rect x="307" y="132" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="339.0" y="162.0" font-size="21" text-anchor="middle">B</text><text x="525" y="161" font-size="18" text-anchor="start"></text><text x="22" y="229" font-size="18" text-anchor="start">push(C)</text><rect x="235" y="199" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="267.0" y="229.0" font-size="21" text-anchor="middle">A</text><rect x="307" y="199" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="339.0" y="229.0" font-size="21" text-anchor="middle">B</text><rect x="379" y="199" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="411.0" y="229.0" font-size="21" text-anchor="middle">C</text><text x="525" y="228" font-size="18" text-anchor="start"></text><text x="22" y="296" font-size="18" text-anchor="start">pop()</text><rect x="235" y="266" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="267.0" y="296.0" font-size="21" text-anchor="middle">A</text><rect x="307" y="266" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="339.0" y="296.0" font-size="21" text-anchor="middle">B</text><text x="525" y="295" font-size="18" text-anchor="start">returns C</text><text x="22" y="363" font-size="18" text-anchor="start">push(D)</text><rect x="235" y="333" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="267.0" y="363.0" font-size="21" text-anchor="middle">A</text><rect x="307" y="333" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="339.0" y="363.0" font-size="21" text-anchor="middle">B</text><rect x="379" y="333" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="411.0" y="363.0" font-size="21" text-anchor="middle">D</text><text x="525" y="362" font-size="18" text-anchor="start"></text><text x="24" y="427" font-size="18" text-anchor="start">peek() now returns D and leaves the stack unchanged.</text></g></svg>