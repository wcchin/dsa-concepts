<svg xmlns="http://www.w3.org/2000/svg" width="845" height="515" viewBox="0 0 845 515" role="img" aria-labelledby="title desc"><title id="title">Safe linked insertion</title><desc id="desc">Before insertion B points to C and X is separate. First X points to C, then B points to X. C remains reachable throughout.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="23" text-anchor="start">Insert after B: preserve the old successor first</text><text x="24" y="95" font-size="19" text-anchor="start">Before</text><rect x="290" y="70" width="90" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="335.0" y="100.0" font-size="21" text-anchor="middle">B</text><rect x="710" y="70" width="90" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="755.0" y="100.0" font-size="21" text-anchor="middle">C</text><rect x="500" y="130" width="90" height="46" rx="7" fill="#ffe5c5" stroke="#8193a5"/><text x="545.0" y="160.0" font-size="21" text-anchor="middle">X</text><path d="M380,93 L710,93" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="500" y="122" font-size="16" text-anchor="start">new node</text><text x="24" y="230" font-size="18" text-anchor="start">1. new.next = b.next</text><rect x="290" y="210" width="90" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="335.0" y="240.0" font-size="21" text-anchor="middle">B</text><rect x="710" y="210" width="90" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="755.0" y="240.0" font-size="21" text-anchor="middle">C</text><rect x="500" y="270" width="90" height="46" rx="7" fill="#ffe5c5" stroke="#8193a5"/><text x="545.0" y="300.0" font-size="21" text-anchor="middle">X</text><path d="M380,233 L710,233" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590,293 L710,244" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="24" y="405" font-size="18" text-anchor="start">2. b.next = new</text><rect x="290" y="380" width="90" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="335.0" y="410.0" font-size="21" text-anchor="middle">B</text><rect x="500" y="380" width="90" height="46" rx="7" fill="#ffe5c5" stroke="#8193a5"/><text x="545.0" y="410.0" font-size="21" text-anchor="middle">X</text><rect x="710" y="380" width="90" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="755.0" y="410.0" font-size="21" text-anchor="middle">C</text><path d="M380,403 L500,403" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590,403 L710,403" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="24" y="480" font-size="18" text-anchor="start">Reversing these two unsaved assignments would make X point to itself.</text></g></svg>