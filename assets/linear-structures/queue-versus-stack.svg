<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430" role="img" aria-labelledby="title desc"><title id="title">Stack versus queue removal</title><desc id="desc">Adding A B C and removing once returns C for a stack and A for a queue. Queue front and back are labelled.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="24" text-anchor="start">Same arrivals, different next-item rules</text><text x="22" y="100" font-size="18" text-anchor="start">Add A, then B, then C</text><rect x="320" y="70" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="352.0" y="100.0" font-size="21" text-anchor="middle">A</text><rect x="392" y="70" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="424.0" y="100.0" font-size="21" text-anchor="middle">B</text><rect x="464" y="70" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="496.0" y="100.0" font-size="21" text-anchor="middle">C</text><text x="24" y="175" font-size="20" text-anchor="start">Stack: remove newest</text><text x="22" y="225" font-size="18" text-anchor="start">Remaining</text><rect x="320" y="195" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="352.0" y="225.0" font-size="21" text-anchor="middle">A</text><rect x="392" y="195" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="424.0" y="225.0" font-size="21" text-anchor="middle">B</text><text x="590" y="225" font-size="20" text-anchor="start">returns C</text><text x="24" y="310" font-size="20" text-anchor="start">Queue: remove oldest</text><text x="22" y="360" font-size="18" text-anchor="start">Remaining</text><rect x="320" y="330" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="352.0" y="360.0" font-size="21" text-anchor="middle">B</text><rect x="392" y="330" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="424.0" y="360.0" font-size="21" text-anchor="middle">C</text><text x="590" y="360" font-size="20" text-anchor="start">returns A</text><text x="320" y="402" font-size="16" text-anchor="start">front</text><text x="428" y="402" font-size="16" text-anchor="start">back</text></g></svg>