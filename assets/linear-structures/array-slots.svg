<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">An array of references</title><desc id="desc">Reference slots are eight bytes apart at hypothetical addresses 1000 1008 1016 1024. Arrows lead to separate payload objects A B C D.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="23" text-anchor="start">Contiguous reference slots, separate payload objects</text><text x="24" y="78" font-size="18" text-anchor="start">Hypothetical base = 1000; slot width = 8 bytes</text><text x="168" y="120" font-size="17" text-anchor="middle">index 0</text><rect x="110" y="140" width="115" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="167.5" y="170.0" font-size="21" text-anchor="middle">reference</text><path d="M168,186 L137,270" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="95" y="270" width="85" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="137.5" y="300.0" font-size="21" text-anchor="middle">A</text><text x="328" y="120" font-size="17" text-anchor="middle">index 1</text><rect x="270" y="140" width="115" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="327.5" y="170.0" font-size="21" text-anchor="middle">reference</text><path d="M328,186 L357,340" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="315" y="340" width="85" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="357.5" y="370.0" font-size="21" text-anchor="middle">B</text><text x="488" y="120" font-size="17" text-anchor="middle">index 2</text><rect x="430" y="140" width="115" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="487.5" y="170.0" font-size="21" text-anchor="middle">reference</text><path d="M488,186 L577,270" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="535" y="270" width="85" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="577.5" y="300.0" font-size="21" text-anchor="middle">C</text><text x="648" y="120" font-size="17" text-anchor="middle">index 3</text><rect x="590" y="140" width="115" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="647.5" y="170.0" font-size="21" text-anchor="middle">reference</text><path d="M648,186 L742,350" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="700" y="350" width="85" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="742.5" y="380.0" font-size="21" text-anchor="middle">D</text><text x="24" y="450" font-size="18" text-anchor="start">Address of slot i = 1000 + 8i. Objects need not be adjacent.</text><rect x="143" y="197" width="50" height="22" fill="white"/><text x="168" y="213" font-size="17" text-anchor="middle">1000</text><rect x="303" y="197" width="50" height="22" fill="white"/><text x="328" y="213" font-size="17" text-anchor="middle">1008</text><rect x="463" y="197" width="50" height="22" fill="white"/><text x="488" y="213" font-size="17" text-anchor="middle">1016</text><rect x="623" y="197" width="50" height="22" fill="white"/><text x="648" y="213" font-size="17" text-anchor="middle">1024</text></g></svg>