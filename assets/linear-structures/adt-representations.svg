<svg xmlns="http://www.w3.org/2000/svg" width="840" height="505" viewBox="0 0 840 505" role="img" aria-labelledby="title desc"><title id="title">ADTs and their representations</title><desc id="desc">A stack can use a dynamic array or linked nodes. A queue can use a circular array or linked nodes. Behaviour is independent of that choice.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="24" text-anchor="start">One ADT can have several implementations</text><rect x="220" y="65" width="380" height="65" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="410" y="92" font-size="22" text-anchor="middle">Stack ADT</text><text x="410" y="116" font-size="17" text-anchor="middle">Newest item leaves first</text><path d="M320,130 L220,177" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M500,130 L600,177" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="25" y="180" width="385" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="217.5" y="210.0" font-size="21" text-anchor="middle">Dynamic array: top at back</text><rect x="430" y="180" width="385" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="622.5" y="210.0" font-size="21" text-anchor="middle">Linked nodes: top at head</text><rect x="220" y="270" width="380" height="65" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="410" y="297" font-size="22" text-anchor="middle">Queue ADT</text><text x="410" y="321" font-size="17" text-anchor="middle">Oldest item leaves first</text><path d="M320,335 L220,382" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M500,335 L600,382" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="25" y="385" width="385" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="217.5" y="415.0" font-size="21" text-anchor="middle">Circular array: moving indices</text><rect x="430" y="385" width="385" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="622.5" y="415.0" font-size="21" text-anchor="middle">Linked nodes: head and tail</text><text x="24" y="480" font-size="18" text-anchor="start">The contract stays the same; storage and operation costs can change.</text></g></svg>