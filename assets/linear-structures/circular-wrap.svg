<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">Circular queue wraparound</title><desc id="desc">A capacity-five queue starts with A B C D. Removing A B moves front to two. E uses slot four, F wraps to slot zero. Logical order is C D E F.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="22" text-anchor="start">A circular queue separates physical slots from logical order</text><text x="22" y="110" font-size="18" text-anchor="start">Start</text><rect x="265" y="80" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="297.0" y="110.0" font-size="21" text-anchor="middle">A</text><rect x="337" y="80" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="369.0" y="110.0" font-size="21" text-anchor="middle">B</text><rect x="409" y="80" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="441.0" y="110.0" font-size="21" text-anchor="middle">C</text><rect x="481" y="80" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="513.0" y="110.0" font-size="21" text-anchor="middle">D</text><rect x="553" y="80" width="64" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="585.0" y="110.0" font-size="21" text-anchor="middle">–</text><text x="297" y="71" font-size="15" text-anchor="middle">0</text><text x="369" y="71" font-size="15" text-anchor="middle">1</text><text x="441" y="71" font-size="15" text-anchor="middle">2</text><text x="513" y="71" font-size="15" text-anchor="middle">3</text><text x="585" y="71" font-size="15" text-anchor="middle">4</text><text x="660" y="98" font-size="17" text-anchor="start">front = 0</text><text x="660" y="123" font-size="17" text-anchor="start">size = 4</text><text x="22" y="210" font-size="18" text-anchor="start">Remove A, then B</text><rect x="265" y="180" width="64" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="297.0" y="210.0" font-size="21" text-anchor="middle">–</text><rect x="337" y="180" width="64" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="369.0" y="210.0" font-size="21" text-anchor="middle">–</text><rect x="409" y="180" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="441.0" y="210.0" font-size="21" text-anchor="middle">C</text><rect x="481" y="180" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="513.0" y="210.0" font-size="21" text-anchor="middle">D</text><rect x="553" y="180" width="64" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="585.0" y="210.0" font-size="21" text-anchor="middle">–</text><text x="297" y="171" font-size="15" text-anchor="middle">0</text><text x="369" y="171" font-size="15" text-anchor="middle">1</text><text x="441" y="171" font-size="15" text-anchor="middle">2</text><text x="513" y="171" font-size="15" text-anchor="middle">3</text><text x="585" y="171" font-size="15" text-anchor="middle">4</text><text x="660" y="198" font-size="17" text-anchor="start">front = 2</text><text x="660" y="223" font-size="17" text-anchor="start">size = 2</text><text x="22" y="310" font-size="18" text-anchor="start">Enqueue E</text><rect x="265" y="280" width="64" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="297.0" y="310.0" font-size="21" text-anchor="middle">–</text><rect x="337" y="280" width="64" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="369.0" y="310.0" font-size="21" text-anchor="middle">–</text><rect x="409" y="280" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="441.0" y="310.0" font-size="21" text-anchor="middle">C</text><rect x="481" y="280" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="513.0" y="310.0" font-size="21" text-anchor="middle">D</text><rect x="553" y="280" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="585.0" y="310.0" font-size="21" text-anchor="middle">E</text><text x="297" y="271" font-size="15" text-anchor="middle">0</text><text x="369" y="271" font-size="15" text-anchor="middle">1</text><text x="441" y="271" font-size="15" text-anchor="middle">2</text><text x="513" y="271" font-size="15" text-anchor="middle">3</text><text x="585" y="271" font-size="15" text-anchor="middle">4</text><text x="660" y="298" font-size="17" text-anchor="start">front = 2</text><text x="660" y="323" font-size="17" text-anchor="start">size = 3</text><text x="22" y="410" font-size="18" text-anchor="start">Enqueue F: wrap</text><rect x="265" y="380" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="297.0" y="410.0" font-size="21" text-anchor="middle">F</text><rect x="337" y="380" width="64" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="369.0" y="410.0" font-size="21" text-anchor="middle">–</text><rect x="409" y="380" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="441.0" y="410.0" font-size="21" text-anchor="middle">C</text><rect x="481" y="380" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="513.0" y="410.0" font-size="21" text-anchor="middle">D</text><rect x="553" y="380" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="585.0" y="410.0" font-size="21" text-anchor="middle">E</text><text x="297" y="371" font-size="15" text-anchor="middle">0</text><text x="369" y="371" font-size="15" text-anchor="middle">1</text><text x="441" y="371" font-size="15" text-anchor="middle">2</text><text x="513" y="371" font-size="15" text-anchor="middle">3</text><text x="585" y="371" font-size="15" text-anchor="middle">4</text><text x="660" y="398" font-size="17" text-anchor="start">front = 2</text><text x="660" y="423" font-size="17" text-anchor="start">size = 4</text><text x="24" y="515" font-size="18" text-anchor="start">Final logical order: C, D, E, F. Next insertion uses slot (2 + 4) % 5 = 1.</text></g></svg>