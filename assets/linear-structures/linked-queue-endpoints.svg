<svg xmlns="http://www.w3.org/2000/svg" width="800" height="575" viewBox="0 0 800 575" role="img" aria-labelledby="title desc"><title id="title">Linked queue endpoint transitions</title><desc id="desc">Empty queue has two None endpoints. First enqueue makes head and tail A. Second adds B at tail. Removing A leaves B at both endpoints; removing B clears both.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="22" text-anchor="start">Linked queue: maintain both endpoints, including empty states</text><text x="24" y="93" font-size="18" text-anchor="start">Initially empty</text><text x="300" y="93" font-size="20" text-anchor="start">head = None; tail = None; size = 0</text><text x="24" y="180" font-size="18" text-anchor="start">Enqueue A</text><rect x="365" y="155" width="80" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="405.0" y="185.0" font-size="21" text-anchor="middle">A</text><text x="365" y="140" font-size="20" text-anchor="start">head = tail; size = 1</text><path d="M445,178 L490,178" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="490" y="169" font-size="16" text-anchor="start">None</text><text x="24" y="285" font-size="18" text-anchor="start">Enqueue B</text><rect x="365" y="260" width="80" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="405.0" y="290.0" font-size="21" text-anchor="middle">A</text><rect x="545" y="260" width="80" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="585.0" y="290.0" font-size="21" text-anchor="middle">B</text><path d="M445,283 L545,283" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="375" y="247" font-size="17" text-anchor="start">head</text><text x="560" y="247" font-size="17" text-anchor="start">tail</text><path d="M625,283 L690,283" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="695" y="290" font-size="18" text-anchor="start">None</text><text x="24" y="390" font-size="18" text-anchor="start">Dequeue A</text><rect x="545" y="365" width="80" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="585.0" y="395.0" font-size="21" text-anchor="middle">B</text><text x="505" y="347" font-size="18" text-anchor="start">head = tail; size = 1</text><path d="M625,388 L690,388" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="695" y="395" font-size="18" text-anchor="start">None</text><text x="24" y="485" font-size="18" text-anchor="start">Dequeue B</text><text x="300" y="485" font-size="20" text-anchor="start">head = None; tail = None; size = 0</text><text x="24" y="545" font-size="19" text-anchor="start">The last removal must clear tail as well as head.</text></g></svg>