<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" role="img" aria-labelledby="title desc"><title id="title">Bracket mismatch on a stack</title><desc id="desc">After opening parenthesis and opening brace, closing parenthesis encounters a brace at the top. The expression is rejected.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="23" text-anchor="start">Bracket matching: the latest opener must match</text><text x="24" y="73" font-size="23" text-anchor="start">Input: ( { ) }</text><text x="330" y="73" font-size="18" text-anchor="start">Stack shown bottom → top</text><text x="22" y="135" font-size="18" text-anchor="start">Read (: push</text><rect x="330" y="105" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="362.0" y="135.0" font-size="21" text-anchor="middle">(</text><text x="22" y="210" font-size="18" text-anchor="start">Read {: push</text><rect x="330" y="180" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="362.0" y="210.0" font-size="21" text-anchor="middle">(</text><rect x="402" y="180" width="64" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="434.0" y="210.0" font-size="21" text-anchor="middle">{</text><rect x="330" y="255" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="362" y="285" font-size="21" text-anchor="middle">(</text><rect x="402" y="255" width="64" height="46" rx="7" fill="#fbe0e0" stroke="#8193a5"/><text x="434" y="285" font-size="21" text-anchor="middle">{</text><text x="24" y="285" font-size="18" text-anchor="start">Read ): inspect top</text><text x="500" y="285" font-size="18" text-anchor="start">Mismatch: expected (</text><text x="24" y="355" font-size="18" text-anchor="start">Reject here: equal bracket counts would not establish correct nesting.</text></g></svg>