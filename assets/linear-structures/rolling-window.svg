<svg xmlns="http://www.w3.org/2000/svg" width="640" height="345" viewBox="0 0 640 345" role="img" aria-labelledby="title desc"><title id="title">A four-reading rolling window</title><desc id="desc">The window 12 15 14 18 discards 12 and appends 20, leaving 15 14 18 20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="24" text-anchor="start">Keep the most recent four readings</text><text x="22" y="100" font-size="18" text-anchor="start">Before arrival</text><rect x="270" y="70" width="64" height="46" rx="7" fill="#ffe5c5" stroke="#8193a5"/><text x="302.0" y="100.0" font-size="21" text-anchor="middle">12</text><rect x="342" y="70" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="374.0" y="100.0" font-size="21" text-anchor="middle">15</text><rect x="414" y="70" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="446.0" y="100.0" font-size="21" text-anchor="middle">14</text><rect x="486" y="70" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="518.0" y="100.0" font-size="21" text-anchor="middle">18</text><text x="24" y="180" font-size="21" text-anchor="start">New reading: 20</text><text x="270" y="180" font-size="18" text-anchor="start">Remove 12 at front; add 20 at back</text><text x="22" y="255" font-size="18" text-anchor="start">After update</text><rect x="270" y="225" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="302.0" y="255.0" font-size="21" text-anchor="middle">15</text><rect x="342" y="225" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="374.0" y="255.0" font-size="21" text-anchor="middle">14</text><rect x="414" y="225" width="64" height="46" rx="7" fill="#eef1f5" stroke="#8193a5"/><text x="446.0" y="255.0" font-size="21" text-anchor="middle">18</text><rect x="486" y="225" width="64" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="518.0" y="255.0" font-size="21" text-anchor="middle">20</text><text x="270" y="310" font-size="17" text-anchor="start">oldest retained</text><text x="486" y="310" font-size="17" text-anchor="start">newest</text></g></svg>