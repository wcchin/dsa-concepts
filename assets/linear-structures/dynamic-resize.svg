<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Dynamic array doubling</title><desc id="desc">Four references are copied from capacity four to capacity eight before E is appended. Five slots are then occupied.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="23" text-anchor="start">A resize changes capacity; an append changes length</text><text x="22" y="105" font-size="18" text-anchor="start">Full: n = 4, c = 4</text><rect x="260" y="75" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="288.0" y="105.0" font-size="21" text-anchor="middle">A</text><rect x="324" y="75" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="352.0" y="105.0" font-size="21" text-anchor="middle">B</text><rect x="388" y="75" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="416.0" y="105.0" font-size="21" text-anchor="middle">C</text><rect x="452" y="75" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="480.0" y="105.0" font-size="21" text-anchor="middle">D</text><text x="22" y="225" font-size="18" text-anchor="start">Copy: n = 4, c = 8</text><rect x="260" y="195" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="288.0" y="225.0" font-size="21" text-anchor="middle">A</text><rect x="324" y="195" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="352.0" y="225.0" font-size="21" text-anchor="middle">B</text><rect x="388" y="195" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="416.0" y="225.0" font-size="21" text-anchor="middle">C</text><rect x="452" y="195" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="480.0" y="225.0" font-size="21" text-anchor="middle">D</text><rect x="516" y="195" width="56" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="544.0" y="225.0" font-size="21" text-anchor="middle">–</text><rect x="580" y="195" width="56" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="608.0" y="225.0" font-size="21" text-anchor="middle">–</text><rect x="644" y="195" width="56" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="672.0" y="225.0" font-size="21" text-anchor="middle">–</text><rect x="708" y="195" width="56" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="736.0" y="225.0" font-size="21" text-anchor="middle">–</text><text x="22" y="345" font-size="18" text-anchor="start">Append: n = 5, c = 8</text><rect x="260" y="315" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="288.0" y="345.0" font-size="21" text-anchor="middle">A</text><rect x="324" y="315" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="352.0" y="345.0" font-size="21" text-anchor="middle">B</text><rect x="388" y="315" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="416.0" y="345.0" font-size="21" text-anchor="middle">C</text><rect x="452" y="315" width="56" height="46" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="480.0" y="345.0" font-size="21" text-anchor="middle">D</text><rect x="516" y="315" width="56" height="46" rx="7" fill="#d7f0e6" stroke="#8193a5"/><text x="544.0" y="345.0" font-size="21" text-anchor="middle">E</text><rect x="580" y="315" width="56" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="608.0" y="345.0" font-size="21" text-anchor="middle">–</text><rect x="644" y="315" width="56" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="672.0" y="345.0" font-size="21" text-anchor="middle">–</text><rect x="708" y="315" width="56" height="46" rx="7" fill="#ffffff" stroke="#8193a5"/><text x="736.0" y="345.0" font-size="21" text-anchor="middle">–</text><text x="24" y="425" font-size="18" text-anchor="start">Only occupied slots belong to the logical sequence. Doubling is a teaching policy.</text></g></svg>