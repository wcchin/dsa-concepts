<svg xmlns="http://www.w3.org/2000/svg" width="770" height="395" viewBox="0 0 770 395" role="img" aria-labelledby="title desc"><title id="title">A doubly linked sequence</title><desc id="desc">A B C are connected by forward next links and backward prev links. Head.prev and tail.next are None.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="22" text-anchor="start">Doubly linked: each neighbour relationship has two links</text><text x="185" y="85" font-size="18" text-anchor="start">head</text><text x="625" y="85" font-size="18" text-anchor="start">tail</text><rect x="150" y="105" width="110" height="95" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="205.0" y="159.5" font-size="21" text-anchor="middle">A</text><rect x="370" y="105" width="110" height="95" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="425.0" y="159.5" font-size="21" text-anchor="middle">B</text><rect x="590" y="105" width="110" height="95" rx="7" fill="#d5e9ff" stroke="#8193a5"/><text x="645.0" y="159.5" font-size="21" text-anchor="middle">C</text><path d="M260,130 L370,130" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="315.0" y="120" font-size="16" text-anchor="middle">next</text><path d="M370,175 L260,175" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="315.0" y="195" font-size="16" text-anchor="middle">prev</text><path d="M480,130 L590,130" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="535.0" y="120" font-size="16" text-anchor="middle">next</text><path d="M590,175 L480,175" stroke="#526b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="535.0" y="195" font-size="16" text-anchor="middle">prev</text><text x="24" y="270" font-size="19" text-anchor="start">head.prev = None</text><text x="465" y="270" font-size="19" text-anchor="start">tail.next = None</text><text x="24" y="325" font-size="19" text-anchor="start">Removing B reconnects A.next to C and C.prev to A.</text><text x="24" y="365" font-size="18" text-anchor="start">Endpoint removal must also update head or tail.</text></g></svg>