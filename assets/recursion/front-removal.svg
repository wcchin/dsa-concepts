<svg xmlns="http://www.w3.org/2000/svg" width="830" height="440" viewBox="0 0 830 440" role="img" aria-labelledby="title desc">
<title id="title">Front removal versus an advancing index</title><desc id="desc">Popping index zero from A B C D shifts B C D left. Keeping the original list and incrementing index i requires no shifts.</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2852a3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#137c65"/></marker></defs>
<rect width="830" height="440" rx="8" fill="white"/>
<text x="24" y="30" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="start">Front removal: the remaining references must shift</text>
<rect x="160" y="60" width="105" height="43" rx="6" fill="#fee8d7" stroke="#52708c" stroke-width="1.4"/>
<text x="212.5" y="87.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">A</text>
<rect x="290" y="60" width="105" height="43" rx="6" fill="#eaf2fb" stroke="#52708c" stroke-width="1.4"/>
<text x="342.5" y="87.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">B</text>
<rect x="420" y="60" width="105" height="43" rx="6" fill="#eaf2fb" stroke="#52708c" stroke-width="1.4"/>
<text x="472.5" y="87.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">C</text>
<rect x="550" y="60" width="105" height="43" rx="6" fill="#eaf2fb" stroke="#52708c" stroke-width="1.4"/>
<text x="602.5" y="87.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">D</text>
<rect x="160" y="171" width="105" height="43" rx="6" fill="#eaf2fb" stroke="#52708c" stroke-width="1.4"/>
<text x="212.5" y="198.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">B</text>
<path d="M342 103 L212 166" fill="none" stroke="#2852a3" stroke-width="2" marker-end="url(#blue)"/>
<rect x="290" y="171" width="105" height="43" rx="6" fill="#eaf2fb" stroke="#52708c" stroke-width="1.4"/>
<text x="342.5" y="198.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">C</text>
<path d="M472 103 L342 166" fill="none" stroke="#2852a3" stroke-width="2" marker-end="url(#blue)"/>
<rect x="420" y="171" width="105" height="43" rx="6" fill="#eaf2fb" stroke="#52708c" stroke-width="1.4"/>
<text x="472.5" y="198.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">D</text>
<path d="M602 103 L472 166" fill="none" stroke="#2852a3" stroke-width="2" marker-end="url(#blue)"/>
<text x="26" y="137" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172438" text-anchor="start">pop(0)</text>
<text x="590" y="198" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172438" text-anchor="start">3 shifts</text>
<text x="24" y="280" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="start">Advance an index: the list stays in place</text>
<rect x="160" y="306" width="105" height="43" rx="6" fill="#eceff3" stroke="#52708c" stroke-width="1.4"/>
<text x="212.5" y="333.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">A</text>
<rect x="290" y="306" width="105" height="43" rx="6" fill="#eaf2fb" stroke="#52708c" stroke-width="1.4"/>
<text x="342.5" y="333.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">B</text>
<rect x="420" y="306" width="105" height="43" rx="6" fill="#eaf2fb" stroke="#52708c" stroke-width="1.4"/>
<text x="472.5" y="333.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">C</text>
<rect x="550" y="306" width="105" height="43" rx="6" fill="#eaf2fb" stroke="#52708c" stroke-width="1.4"/>
<text x="602.5" y="333.5" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#172438" text-anchor="middle">D</text>
<text x="160" y="391" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#172438" text-anchor="start">consumed</text>
<text x="300" y="391" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#137c65" text-anchor="start">i = 1</text>
<path d="M342 370 V354" fill="none" stroke="#137c65" stroke-width="2" marker-end="url(#green)"/>
<text x="520" y="391" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#137c65" text-anchor="start">0 shifts</text>
</svg>
