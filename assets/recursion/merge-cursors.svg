<svg xmlns="http://www.w3.org/2000/svg" width="790" height="375" viewBox="0 0 790 375" role="img" aria-labelledby="title desc">
<title id="title">Merge cursors after appending five and eight</title><desc id="desc">The first values of each sorted half are consumed. Index i points to 12, j to 14. The result currently contains 5 and 8; 12 is selected next.</desc>
