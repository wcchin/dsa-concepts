<svg xmlns="http://www.w3.org/2000/svg" width="950" height="400" viewBox="0 0 950 400" role="img" aria-labelledby="title desc">
<title id="title">Work per level in balanced merge sort</title><desc id="desc">For eight items the level sizes are eight; four plus four; four copies of two; eight singleton leaves. Each of three merge levels writes eight output items.</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2852a3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#137c65"/></marker></defs>
