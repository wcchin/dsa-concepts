<svg xmlns="http://www.w3.org/2000/svg" width="790" height="505" viewBox="0 0 790 505" role="img" aria-labelledby="title desc"><title id="title">The shared undirected lecture graph</title><desc id="desc">Edges AB AC BD BE CF DE EF FG connect A through G, including a cycle. Vertex H is isolated.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#718597"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="24" text-anchor="start">Shared graph: 8 vertices, 8 undirected edges</text><path d="M85,240 L260,110" stroke="#718597" stroke-width="2" fill="none"/><path d="M85,240 L260,370" stroke="#718597" stroke-width="2" fill="none"/><path d="M260,110 L450,110" stroke="#718597" stroke-width="2" fill="none"/><path d="M260,110 L450,240" stroke="#718597" stroke-width="2" fill="none"/><path d="M260,370 L450,370" stroke="#718597" stroke-width="2" fill="none"/><path d="M450,110 L450,240" stroke="#718597" stroke-width="2" fill="none"/><path d="M450,240 L450,370" stroke="#718597" stroke-width="2" fill="none"/><path d="M450,370 L680,370" stroke="#718597" stroke-width="2" fill="none"/><circle cx="85" cy="240" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="85" y="247" font-size="22" text-anchor="middle">A</text><circle cx="260" cy="110" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="260" y="117" font-size="22" text-anchor="middle">B</text><rect x="224.0" y="144" width="72" height="21" fill="white"/><text x="260" y="160" font-size="16" text-anchor="middle">degree 3</text><circle cx="260" cy="370" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="260" y="377" font-size="22" text-anchor="middle">C</text><circle cx="450" cy="110" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="450" y="117" font-size="22" text-anchor="middle">D</text><circle cx="450" cy="240" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="450" y="247" font-size="22" text-anchor="middle">E</text><circle cx="450" cy="370" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="450" y="377" font-size="22" text-anchor="middle">F</text><circle cx="680" cy="370" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="680" y="377" font-size="22" text-anchor="middle">G</text><rect x="644.0" y="404" width="72" height="21" fill="white"/><text x="680" y="420" font-size="16" text-anchor="middle">degree 1</text><circle cx="680" cy="110" r="25" fill="#ffe5c5" stroke="#6e879b" stroke-width="2"/><text x="680" y="117" font-size="22" text-anchor="middle">H</text><rect x="604.0" y="144" width="152" height="21" fill="white"/><text x="680" y="160" font-size="16" text-anchor="middle">isolated: degree 0</text><text x="24" y="470" font-size="18" text-anchor="start">Cycle B–D–E–B; path A–C–F–G. Drawn lengths are not edge weights.</text></g></svg>