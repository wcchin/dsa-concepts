<svg xmlns="http://www.w3.org/2000/svg" width="820" height="550" viewBox="0 0 820 550" role="img" aria-labelledby="title desc"><title id="title">Direction and weighted route costs</title><desc id="desc">Three examples show undirected versus directed movement, then an expensive direct connection of cost ten and a two-edge route of total cost four.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#718597"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="24" text-anchor="start">Direction and weights answer different questions</text><text x="24" y="85" font-size="20" text-anchor="start">Undirected</text><path d="M240,100 L430,100" stroke="#718597" stroke-width="2" fill="none"/><circle cx="240" cy="100" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="240" y="107" font-size="22" text-anchor="middle">A</text><circle cx="430" cy="100" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="430" y="107" font-size="22" text-anchor="middle">B</text><text x="520" y="106" font-size="18" text-anchor="start">Both directions permitted</text><text x="24" y="190" font-size="20" text-anchor="start">Directed</text><path d="M265,205 L403,205" stroke="#718597" stroke-width="2" fill="none" marker-end="url(#arrow)"/><circle cx="240" cy="205" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="240" y="212" font-size="22" text-anchor="middle">A</text><circle cx="430" cy="205" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="430" y="212" font-size="22" text-anchor="middle">B</text><text x="520" y="211" font-size="18" text-anchor="start">Only A → B is supplied</text><text x="24" y="310" font-size="20" text-anchor="start">Weighted routes</text><path d="M240,330 L430,330" stroke="#718597" stroke-width="2" fill="none"/><path d="M240,330 L335,450" stroke="#718597" stroke-width="2" fill="none"/><path d="M335,450 L430,330" stroke="#718597" stroke-width="2" fill="none"/><circle cx="240" cy="330" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="240" y="337" font-size="22" text-anchor="middle">A</text><circle cx="430" cy="330" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="430" y="337" font-size="22" text-anchor="middle">B</text><circle cx="335" cy="450" r="25" fill="#d5e9ff" stroke="#6e879b" stroke-width="2"/><text x="335" y="457" font-size="22" text-anchor="middle">C</text><rect x="314" y="311" width="42" height="27" rx="5" fill="#ffffff" stroke="#8799aa"/><text x="335" y="331" font-size="18" text-anchor="middle">10</text><text x="265" y="398" font-size="19" text-anchor="start">2</text><text x="400" y="398" font-size="19" text-anchor="start">2</text><text x="520" y="337" font-size="18" text-anchor="start">A → B: 1 hop, cost 10</text><text x="520" y="380" font-size="18" text-anchor="start">A → C → B: 2 hops, cost 4</text><text x="24" y="515" font-size="19" text-anchor="start">Fewest hops and least total cost can select different routes.</text></g></svg>