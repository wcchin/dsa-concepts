<svg xmlns="http://www.w3.org/2000/svg" width="850" height="550" viewBox="0 0 850 550" role="img" aria-labelledby="title desc"><title id="title">Two connected components</title><desc id="desc">A through G form one connected component; isolated H forms a second. The shared seen set prevents repeat searches.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#718597"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="23" text-anchor="start">Undirected components: restart only at an unseen vertex</text><polygon points="28,65 520,65 520,280 733,280 733,430 28,430" fill="#d7f0e6" fill-opacity="0.35" stroke="#b3d4c8"/><path d="M85,240 L260,110" stroke="#718597" stroke-width="2" fill="none"/><path d="M85,240 L260,370" stroke="#718597" stroke-width="2" fill="none"/><path d="M260,110 L450,110" stroke="#718597" stroke-width="2" fill="none"/><path d="M260,110 L450,240" stroke="#718597" stroke-width="2" fill="none"/><path d="M260,370 L450,370" stroke="#718597" stroke-width="2" fill="none"/><path d="M450,110 L450,240" stroke="#718597" stroke-width="2" fill="none"/><path d="M450,240 L450,370" stroke="#718597" stroke-width="2" fill="none"/><path d="M450,370 L680,370" stroke="#718597" stroke-width="2" fill="none"/><circle cx="85" cy="240" r="25" fill="#d7f0e6" stroke="#6e879b" stroke-width="2"/><text x="85" y="247" font-size="22" text-anchor="middle">A</text><circle cx="260" cy="110" r="25" fill="#d7f0e6" stroke="#6e879b" stroke-width="2"/><text x="260" y="117" font-size="22" text-anchor="middle">B</text><circle cx="260" cy="370" r="25" fill="#d7f0e6" stroke="#6e879b" stroke-width="2"/><text x="260" y="377" font-size="22" text-anchor="middle">C</text><circle cx="450" cy="110" r="25" fill="#d7f0e6" stroke="#6e879b" stroke-width="2"/><text x="450" y="117" font-size="22" text-anchor="middle">D</text><circle cx="450" cy="240" r="25" fill="#d7f0e6" stroke="#6e879b" stroke-width="2"/><text x="450" y="247" font-size="22" text-anchor="middle">E</text><circle cx="450" cy="370" r="25" fill="#d7f0e6" stroke="#6e879b" stroke-width="2"/><text x="450" y="377" font-size="22" text-anchor="middle">F</text><circle cx="680" cy="370" r="25" fill="#d7f0e6" stroke="#6e879b" stroke-width="2"/><text x="680" y="377" font-size="22" text-anchor="middle">G</text><circle cx="680" cy="110" r="25" fill="#ffe5c5" stroke="#6e879b" stroke-width="2"/><text x="680" y="117" font-size="22" text-anchor="middle">H</text><text x="580" y="62" font-size="18" text-anchor="start">Component 2: {H}</text><text x="24" y="470" font-size="19" text-anchor="start">Component 1: A, B, C, D, E, F, G</text><text x="24" y="515" font-size="18" text-anchor="start">After the first search, B–G are already seen. H starts a second search.</text></g></svg>