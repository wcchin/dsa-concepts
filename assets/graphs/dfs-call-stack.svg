<svg xmlns="http://www.w3.org/2000/svg" width="800" height="675" viewBox="0 0 800 675" role="img" aria-labelledby="title desc"><title id="title">DFS frames, returns and resumption</title><desc id="desc">After A B D E F, DFS temporarily calls C, returns to F, then calls G. Orange marks the currently active call.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#718597"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="33" font-size="22" text-anchor="start">DFS call stack: bottom on the left, active call on the right</text><text x="24" y="113" font-size="18" text-anchor="start">E discovered</text><rect x="310" y="85" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="337" y="113" font-size="22" text-anchor="middle">A</text><rect x="378" y="85" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="405" y="113" font-size="22" text-anchor="middle">B</text><rect x="446" y="85" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="473" y="113" font-size="22" text-anchor="middle">D</text><rect x="514" y="85" width="55" height="42" rx="5" fill="#ffe5c5" stroke="#8799aa"/><text x="541" y="113" font-size="22" text-anchor="middle">E</text><text x="24" y="185" font-size="18" text-anchor="start">F discovered</text><rect x="310" y="157" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="337" y="185" font-size="22" text-anchor="middle">A</text><rect x="378" y="157" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="405" y="185" font-size="22" text-anchor="middle">B</text><rect x="446" y="157" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="473" y="185" font-size="22" text-anchor="middle">D</text><rect x="514" y="157" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="541" y="185" font-size="22" text-anchor="middle">E</text><rect x="582" y="157" width="55" height="42" rx="5" fill="#ffe5c5" stroke="#8799aa"/><text x="609" y="185" font-size="22" text-anchor="middle">F</text><text x="24" y="257" font-size="18" text-anchor="start">C discovered</text><rect x="310" y="229" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="337" y="257" font-size="22" text-anchor="middle">A</text><rect x="378" y="229" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="405" y="257" font-size="22" text-anchor="middle">B</text><rect x="446" y="229" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="473" y="257" font-size="22" text-anchor="middle">D</text><rect x="514" y="229" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="541" y="257" font-size="22" text-anchor="middle">E</text><rect x="582" y="229" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="609" y="257" font-size="22" text-anchor="middle">F</text><rect x="650" y="229" width="55" height="42" rx="5" fill="#ffe5c5" stroke="#8799aa"/><text x="677" y="257" font-size="22" text-anchor="middle">C</text><text x="24" y="329" font-size="18" text-anchor="start">C finishes; resume F</text><rect x="310" y="301" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="337" y="329" font-size="22" text-anchor="middle">A</text><rect x="378" y="301" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="405" y="329" font-size="22" text-anchor="middle">B</text><rect x="446" y="301" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="473" y="329" font-size="22" text-anchor="middle">D</text><rect x="514" y="301" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="541" y="329" font-size="22" text-anchor="middle">E</text><rect x="582" y="301" width="55" height="42" rx="5" fill="#ffe5c5" stroke="#8799aa"/><text x="609" y="329" font-size="22" text-anchor="middle">F</text><text x="24" y="401" font-size="18" text-anchor="start">G discovered</text><rect x="310" y="373" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="337" y="401" font-size="22" text-anchor="middle">A</text><rect x="378" y="373" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="405" y="401" font-size="22" text-anchor="middle">B</text><rect x="446" y="373" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="473" y="401" font-size="22" text-anchor="middle">D</text><rect x="514" y="373" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="541" y="401" font-size="22" text-anchor="middle">E</text><rect x="582" y="373" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="609" y="401" font-size="22" text-anchor="middle">F</text><rect x="650" y="373" width="55" height="42" rx="5" fill="#ffe5c5" stroke="#8799aa"/><text x="677" y="401" font-size="22" text-anchor="middle">G</text><text x="24" y="473" font-size="18" text-anchor="start">G finishes; resume F</text><rect x="310" y="445" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="337" y="473" font-size="22" text-anchor="middle">A</text><rect x="378" y="445" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="405" y="473" font-size="22" text-anchor="middle">B</text><rect x="446" y="445" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="473" y="473" font-size="22" text-anchor="middle">D</text><rect x="514" y="445" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="541" y="473" font-size="22" text-anchor="middle">E</text><rect x="582" y="445" width="55" height="42" rx="5" fill="#ffe5c5" stroke="#8799aa"/><text x="609" y="473" font-size="22" text-anchor="middle">F</text><text x="24" y="545" font-size="18" text-anchor="start">F finishes; resume E</text><rect x="310" y="517" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="337" y="545" font-size="22" text-anchor="middle">A</text><rect x="378" y="517" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="405" y="545" font-size="22" text-anchor="middle">B</text><rect x="446" y="517" width="55" height="42" rx="5" fill="#d5e9ff" stroke="#8799aa"/><text x="473" y="545" font-size="22" text-anchor="middle">D</text><rect x="514" y="517" width="55" height="42" rx="5" fill="#ffe5c5" stroke="#8799aa"/><text x="541" y="545" font-size="22" text-anchor="middle">E</text><text x="24" y="640" font-size="18" text-anchor="start">F checks C, then E (already seen), then G in its stored neighbour order.</text></g></svg>