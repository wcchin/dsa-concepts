<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title desc">
<title id="title">Linked nodes and separate stop objects</title><desc id="desc">first points to the first RouteNode, which points through next to the second RouteNode. Each node has a stop reference to a separate ShuttleStop. The final next is None.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2852a3"/></marker></defs>
<rect width="800" height="350" rx="8" fill="#fff"/>
<text x="24" y="32" font-family="sans-serif" font-size="20" fill="#172438">The route order comes from next references</text>
<text x="24" y="100" font-family="sans-serif" font-size="17" fill="#172438">first</text>
<rect x="130" y="62" width="235" height="86" rx="7" fill="#eaf2fb" stroke="#52708c" stroke-width="1.5"/>
<text x="142" y="111.0" font-family="sans-serif" font-size="17" fill="#172438">RouteNode 1</text>
<rect x="430" y="62" width="235" height="86" rx="7" fill="#eaf2fb" stroke="#52708c" stroke-width="1.5"/>
<text x="442" y="111.0" font-family="sans-serif" font-size="17" fill="#172438">RouteNode 2</text>
<text x="700" y="116" font-family="sans-serif" font-size="17" fill="#172438">None</text>
<text x="147" y="133" font-family="sans-serif" font-size="15" fill="#172438">stop</text>
<text x="447" y="133" font-family="sans-serif" font-size="15" fill="#172438">stop</text>
<path d="M65 95 H125" fill="none" stroke="#2852a3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M340 128 L425 95" fill="none" stroke="#2852a3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640 128 H692" fill="none" stroke="#2852a3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="130" y="235" width="235" height="80" rx="7" fill="#dcf3eb" stroke="#52708c" stroke-width="1.5"/>
<text x="142" y="281.0" font-family="sans-serif" font-size="17" fill="#172438">ShuttleStop: KR</text>
<rect x="430" y="235" width="235" height="80" rx="7" fill="#dcf3eb" stroke="#52708c" stroke-width="1.5"/>
<text x="442" y="281.0" font-family="sans-serif" font-size="17" fill="#172438">ShuttleStop: MUS</text>
<path d="M165 148 V230" fill="none" stroke="#2852a3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M465 148 V230" fill="none" stroke="#2852a3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="145" y="297" font-family="sans-serif" font-size="16" fill="#172438">Kent Ridge</text>
<text x="445" y="297" font-family="sans-serif" font-size="16" fill="#172438">Museum</text>
<text x="24" y="333" font-family="sans-serif" font-size="16" fill="#172438">Rebinding current follows a link; assigning node.next changes a link.</text>
<text x="300" y="133" font-family="sans-serif" font-size="15" fill="#172438">next</text>
<text x="600" y="133" font-family="sans-serif" font-size="15" fill="#172438">next</text>
</svg>
