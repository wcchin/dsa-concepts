<svg xmlns="http://www.w3.org/2000/svg" width="950" height="630" viewBox="0 0 950 630" role="img" aria-labelledby="title desc"><title id="title">A diagonal line is a bounding-box false positive</title><desc id="desc">Query2 6 4 8 overlaps L1 envelope but not the diagonal; horizontal L2 and vertical L4 intersect the rectangle.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="25" text-anchor="start">A box can intersect while its geometry misses</text><rect x="55.0" y="90.0" width="420.0" height="420.0" fill="none" fill-opacity="1" stroke="#8196a7" stroke-width="2"/><text x="55.0" y="535.0" font-size="15" text-anchor="middle">0</text><text x="43.0" y="515.0" font-size="15" text-anchor="end">0</text><text x="160.0" y="535.0" font-size="15" text-anchor="middle">3</text><text x="43.0" y="410.0" font-size="15" text-anchor="end">3</text><text x="265.0" y="535.0" font-size="15" text-anchor="middle">6</text><text x="43.0" y="305.0" font-size="15" text-anchor="end">6</text><text x="370.0" y="535.0" font-size="15" text-anchor="middle">9</text><text x="43.0" y="200.0" font-size="15" text-anchor="end">9</text><text x="475.0" y="535.0" font-size="15" text-anchor="middle">12</text><text x="43.0" y="95.0" font-size="15" text-anchor="end">12</text><text x="491" y="515" font-size="17" text-anchor="start">x</text><text x="53" y="75" font-size="17" text-anchor="start">y</text><rect x="125.0" y="230.0" width="70.0" height="70.0" fill="#d7f0e6" fill-opacity="0.7" stroke="#248a72" stroke-width="2"/><rect x="55.0" y="160.0" width="350.0" height="350.0" fill="none" fill-opacity="1" stroke="#bd7727" stroke-width="2" stroke-dasharray="6 4"/><path d="M55.0,510.0 L405.0,160.0" stroke="#365d89" stroke-width="2.5" fill="none"/><rect x="233.0" y="327.5" width="30" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="248.0" y="344.5" font-size="14" text-anchor="middle">L1</text><path d="M55.0,265.0 L265.0,265.0" stroke="#365d89" stroke-width="2.5" fill="none"/><rect x="226.0" y="240.0" width="30" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="241.0" y="257.0" font-size="14" text-anchor="middle">L2</text><path d="M335.0,510.0 L405.0,440.0" stroke="#365d89" stroke-width="2.5" fill="none"/><rect x="348.50000000000006" y="457.0" width="30" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="363.50000000000006" y="474.0" font-size="14" text-anchor="middle">L3</text><path d="M160.0,335.0 L160.0,195.0" stroke="#365d89" stroke-width="2.5" fill="none"/><rect x="163.0" y="198.00000000000006" width="30" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="178.0" y="215.00000000000006" font-size="14" text-anchor="middle">L4</text><path d="M230.0,300.0 L370.0,230.0" stroke="#365d89" stroke-width="2.5" fill="none"/><rect x="303.0" y="240.0" width="30" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="318.0" y="257.0" font-size="14" text-anchor="middle">L5</text><text x="525" y="120" font-size="22" text-anchor="start">Bounding-box candidates:</text><text x="525" y="165" font-size="23" text-anchor="start">L1, L2, L4</text><text x="525" y="250" font-size="22" text-anchor="start">Exact segment matches:</text><text x="525" y="295" font-size="23" text-anchor="start">L2, L4</text><text x="525" y="390" font-size="21" text-anchor="start">L1 follows y = x.</text><text x="525" y="435" font-size="18" text-anchor="start">At x in [2,4], y is below [6,8].</text><text x="24" y="590" font-size="20" text-anchor="start">Refinement rejects L1. Correct enclosing bounds keep every true match.</text></g></svg>