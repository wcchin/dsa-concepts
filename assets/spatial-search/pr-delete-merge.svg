<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">PR deletion merges a complete sibling group</title><desc id="desc">In the root NW cell, delete B from its bucket. Only E remains, so four leaf siblings merge into their parent bucket. The root boundary remains unchanged.</desc><style>text{font-family:Arial,sans-serif;fill:#18334a;font-size:18px} .heading{font-size:23px;font-weight:bold} .small{font-size:16px} .node{fill:#edf5fc;stroke:#346887;stroke-width:2} .edge{stroke:#60798a;stroke-width:2;fill:none} .note{fill:#a13d20} </style><rect width="900" height="380" rx="12" fill="#fff"/><text x="25" y="38" class="heading">Delete B, then merge the NW sibling leaves</text>
<text x="45" y="85">Before: NW cell has 4 leaves</text><rect class="node" x="45" y="110" width="270" height="180"/><path class="edge" d="M180 110V290M45 200H315"/><text x="100" y="155">empty</text><text x="220" y="155">empty</text><text x="95" y="250">B</text><text x="235" y="250">E</text><path d="M77 228L120 263M77 263L120 228" stroke="#b44e32" stroke-width="3"/>
<text x="355" y="195">delete B</text><path class="edge" d="M350 215H490L475 205M490 215L475 225"/>
<text x="535" y="85">After: one leaf bucket</text><rect class="node" x="535" y="110" width="270" height="180"/><text x="650" y="210" class="heading">E</text><text x="45" y="335">1 remaining point ≤ capacity 1. Parent extent stays [0,6) × [6,12).</text></svg>