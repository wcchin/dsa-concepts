<svg xmlns="http://www.w3.org/2000/svg" width="920" height="630" viewBox="0 0 920 630" role="img" aria-labelledby="title desc"><title id="title">A finite-depth overflow bucket</title><desc id="desc">With extent0 to1, capacity1 and max depth1, close distinct points P and Q share SW overflow bucket; a duplicate P is ignored.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="25" text-anchor="start">Stop subdivision without losing close points</text><rect x="55.0" y="95.0" width="410.0" height="410.0" fill="none" fill-opacity="1" stroke="#8196a7" stroke-width="2"/><text x="55.0" y="530.0" font-size="15" text-anchor="middle">0</text><text x="43.0" y="510.0" font-size="15" text-anchor="end">0</text><text x="260.0" y="530.0" font-size="15" text-anchor="middle">0.5</text><text x="43.0" y="305.0" font-size="15" text-anchor="end">0.5</text><text x="465.0" y="530.0" font-size="15" text-anchor="middle">1</text><text x="43.0" y="100.0" font-size="15" text-anchor="end">1</text><text x="481" y="510" font-size="17" text-anchor="start">x</text><text x="53" y="80" font-size="17" text-anchor="start">y</text><path d="M260.0,505.0 L260.0,95.0" stroke="#71889b" stroke-width="1.5" fill="none"/><path d="M55.0,300.0 L465.0,300.0" stroke="#71889b" stroke-width="1.5" fill="none"/><rect x="55.0" y="300.0" width="205.0" height="205.0" fill="#ffe5c5" fill-opacity="0.3" stroke="#c37d2b" stroke-width="2"/><circle cx="96.0" cy="464.0" r="4" fill="#182f49"/><text x="121.0" y="484.0" font-size="15" text-anchor="start">P = (0.10,0.10)</text><circle cx="104.19999999999999" cy="455.8" r="4" fill="#182f49"/><text x="129.2" y="430.8" font-size="15" text-anchor="start">Q = (0.12,0.12)</text><text x="525" y="115" font-size="23" text-anchor="start">Capacity target: 1</text><text x="525" y="170" font-size="23" text-anchor="start">Maximum depth: 1</text><rect x="525" y="220" width="340" height="130" rx="4" fill="#ffe5c5" stroke="#8297aa"/><text x="545" y="260" font-size="21" text-anchor="start">SW overflow bucket: P, Q</text><text x="545" y="310" font-size="18" text-anchor="start">Both distinct records are retained.</text><text x="525" y="410" font-size="18" text-anchor="start">Insert P again → False; no new record.</text><text x="24" y="590" font-size="19" text-anchor="start">A stopping limit permits overflow; a repeated coordinate is a separate case.</text></g></svg>