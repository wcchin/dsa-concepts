<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="605" viewBox="0 0 1080 605" role="img" aria-labelledby="title desc"><title id="title">Compare the three root splitting rules</title><desc id="desc">At A5 4, k-d root splits x5, point quadtree splits x5 y4; PR root over0 to12 splits x6 y6.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="24" text-anchor="start">The same first insertion does not imply the same first split</text><text x="180" y="85" font-size="23" text-anchor="middle">K-d tree</text><rect x="40.0" y="115.0" width="280.0" height="280.0" fill="none" fill-opacity="1" stroke="#8196a7" stroke-width="2"/><path d="M156.66666666666669,395.0 L156.66666666666669,115.0" stroke="#365d89" stroke-width="2.5" fill="none"/><circle cx="156.66666666666669" cy="301.6666666666667" r="6" fill="#d7f0e6" stroke="#182f49"/><text x="166.66666666666669" y="293.6666666666667" font-size="18" text-anchor="start">A</text><text x="180" y="450" font-size="20" text-anchor="middle">x = 5</text><text x="180" y="490" font-size="18" text-anchor="middle">One active axis</text><text x="530" y="85" font-size="23" text-anchor="middle">Point quadtree</text><rect x="390.0" y="115.0" width="280.0" height="280.0" fill="none" fill-opacity="1" stroke="#8196a7" stroke-width="2"/><path d="M506.6666666666667,395.0 L506.6666666666667,115.0" stroke="#365d89" stroke-width="2.5" fill="none"/><path d="M390.0,301.6666666666667 L670.0,301.6666666666667" stroke="#365d89" stroke-width="2.5" fill="none"/><circle cx="506.6666666666667" cy="301.6666666666667" r="6" fill="#d7f0e6" stroke="#182f49"/><text x="516.6666666666667" y="293.6666666666667" font-size="18" text-anchor="start">A</text><text x="530" y="450" font-size="20" text-anchor="middle">x = 5 and y = 4</text><text x="530" y="490" font-size="18" text-anchor="middle">Both axes through A</text><text x="880" y="85" font-size="23" text-anchor="middle">PR quadtree</text><rect x="740.0" y="115.0" width="280.0" height="280.0" fill="none" fill-opacity="1" stroke="#8196a7" stroke-width="2"/><path d="M880.0,395.0 L880.0,115.0" stroke="#365d89" stroke-width="2.5" fill="none"/><path d="M740.0,255.0 L1020.0,255.0" stroke="#365d89" stroke-width="2.5" fill="none"/><circle cx="856.6666666666666" cy="301.6666666666667" r="6" fill="#d7f0e6" stroke="#182f49"/><text x="866.6666666666666" y="293.6666666666667" font-size="18" text-anchor="start">A</text><text x="880" y="450" font-size="20" text-anchor="middle">x = 6 and y = 6</text><text x="880" y="490" font-size="18" text-anchor="middle">Midpoints of [0,12)²</text><text x="24" y="565" font-size="21" text-anchor="start">K-d and point quadtrees use data-point pivots; PR trees use cell midpoints.</text></g></svg>