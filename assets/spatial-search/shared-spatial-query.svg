<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" role="img" aria-labelledby="title desc"><title id="title">Shared points and inclusive range query</title><desc id="desc">Seven points A through G; closed rectangle x1 to4 y2 to7 contains B D E. PR storage extent0 to12 is half-open.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="25" text-anchor="start">One point set, one closed range query</text><rect x="55.0" y="90.0" width="420.0" height="420.0" fill="none" fill-opacity="1" stroke="#8196a7" stroke-width="2"/><text x="55.0" y="535.0" font-size="15" text-anchor="middle">0</text><text x="43.0" y="515.0" font-size="15" text-anchor="end">0</text><text x="160.0" y="535.0" font-size="15" text-anchor="middle">3</text><text x="43.0" y="410.0" font-size="15" text-anchor="end">3</text><text x="265.0" y="535.0" font-size="15" text-anchor="middle">6</text><text x="43.0" y="305.0" font-size="15" text-anchor="end">6</text><text x="370.0" y="535.0" font-size="15" text-anchor="middle">9</text><text x="43.0" y="200.0" font-size="15" text-anchor="end">9</text><text x="475.0" y="535.0" font-size="15" text-anchor="middle">12</text><text x="43.0" y="95.0" font-size="15" text-anchor="end">12</text><text x="491" y="515" font-size="17" text-anchor="start">x</text><text x="53" y="75" font-size="17" text-anchor="start">y</text><rect x="90.0" y="265.0" width="105.0" height="175.0" fill="#d7f0e6" fill-opacity="0.6" stroke="#248a72" stroke-width="2"/><circle cx="230.0" cy="370.0" r="6" fill="#d5e9ff" stroke="#182f49"/><rect x="237.0" y="346.0" width="22" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="248.0" y="363.0" font-size="16" text-anchor="middle">A</text><circle cx="125.0" cy="265.0" r="6" fill="#d7f0e6" stroke="#182f49"/><rect x="132.0" y="241.0" width="22" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="143.0" y="258.0" font-size="16" text-anchor="middle">B</text><circle cx="335.0" cy="475.0" r="6" fill="#d5e9ff" stroke="#182f49"/><rect x="342.0" y="451.0" width="22" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="353.0" y="468.0" font-size="16" text-anchor="middle">C</text><circle cx="90.0" cy="405.0" r="6" fill="#d7f0e6" stroke="#182f49"/><rect x="97.0" y="381.0" width="22" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="108.0" y="398.0" font-size="16" text-anchor="middle">D</text><circle cx="160.0" cy="300.0" r="6" fill="#d7f0e6" stroke="#182f49"/><rect x="167.0" y="276.0" width="22" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="178.0" y="293.0" font-size="16" text-anchor="middle">E</text><circle cx="300.0" cy="335.0" r="6" fill="#d5e9ff" stroke="#182f49"/><rect x="307.0" y="311.0" width="22" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="318.0" y="328.0" font-size="16" text-anchor="middle">F</text><circle cx="370.0" cy="440.0" r="6" fill="#d5e9ff" stroke="#182f49"/><rect x="377.0" y="416.0" width="22" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="388.0" y="433.0" font-size="16" text-anchor="middle">G</text><text x="525" y="110" font-size="23" text-anchor="start">Query: [1,4] × [2,7]</text><text x="525" y="175" font-size="19" text-anchor="start">B = (2,7): upper-edge match</text><text x="525" y="220" font-size="19" text-anchor="start">D = (1,3): left-edge match</text><text x="525" y="265" font-size="19" text-anchor="start">E = (3,6): interior match</text><text x="525" y="340" font-size="19" text-anchor="start">Storage extent for the PR tree:</text><text x="525" y="380" font-size="23" text-anchor="start">[0,12) × [0,12)</text><text x="24" y="590" font-size="21" text-anchor="start">The index changes; the requested answer set remains {B,D,E}.</text></g></svg>