<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">R-tree nearest uses exact segment distance</title><desc id="desc">Q is inside the bounding rectangle of diagonal L1 but is much closer to vertical segment L4.</desc><style>text{font-family:Arial,sans-serif;fill:#18334a;font-size:18px} .heading{font-size:23px;font-weight:bold} .small{font-size:16px} .node{fill:#edf5fc;stroke:#346887;stroke-width:2} .edge{stroke:#60798a;stroke-width:2;fill:none} .note{fill:#a13d20} </style><rect width="900" height="380" rx="12" fill="#fff"/><text x="25" y="35" class="heading">Nearest rectangle ≠ nearest segment</text><line x1="55" y1="330" x2="297" y2="330" stroke="#657b89" stroke-width="1" stroke-dasharray=""/><line x1="55" y1="330" x2="55" y2="88" stroke="#657b89" stroke-width="1" stroke-dasharray=""/><rect x="55" y="110" width="220" height="220" fill="#edf5fc" stroke="#8a9dae" stroke-dasharray="5 4"/><line x1="55" y1="330" x2="275" y2="110" stroke="#497a9d" stroke-width="3" stroke-dasharray=""/><line x1="121" y1="220" x2="121" y2="132" stroke="#c35b26" stroke-width="5" stroke-dasharray=""/><line x1="99" y1="132" x2="121" y2="132" stroke="#24805c" stroke-width="3" stroke-dasharray="4 3"/><circle cx="99" cy="132" r="5" fill="#24805c"/><text x="94" y="117" class="small">Q=(2,9)</text><text x="290" y="120" class="small">L1: y=x</text><text x="125" y="245" class="small">L4</text><text x="55" y="355" class="small">L1 MBR: [0,10] × [0,10]</text><text x="420" y="120">L1 box bound² = 0</text><text x="420" y="163">L1 exact segment distance² = 24.5</text><text x="420" y="220" fill="#c35b26">L4 exact segment distance² = 1</text><text x="420" y="280">Bounds prioritise work.</text><text x="420" y="315">Exact distances decide the answer.</text></svg>