<svg xmlns="http://www.w3.org/2000/svg" width="980" height="630" viewBox="0 0 980 630" role="img" aria-labelledby="title desc"><title id="title">R-tree child enclosures and overlapping groups</title><desc id="desc">Groups U with L1 L2 and V with L3 L4 L5 have overlapping enclosing rectangles; both intersect the query.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="24" text-anchor="start">R-tree groups enclose objects; sibling groups can overlap</text><rect x="55.0" y="90.0" width="420.0" height="420.0" fill="none" fill-opacity="1" stroke="#8196a7" stroke-width="2"/><text x="55.0" y="535.0" font-size="15" text-anchor="middle">0</text><text x="43.0" y="515.0" font-size="15" text-anchor="end">0</text><text x="160.0" y="535.0" font-size="15" text-anchor="middle">3</text><text x="43.0" y="410.0" font-size="15" text-anchor="end">3</text><text x="265.0" y="535.0" font-size="15" text-anchor="middle">6</text><text x="43.0" y="305.0" font-size="15" text-anchor="end">6</text><text x="370.0" y="535.0" font-size="15" text-anchor="middle">9</text><text x="43.0" y="200.0" font-size="15" text-anchor="end">9</text><text x="475.0" y="535.0" font-size="15" text-anchor="middle">12</text><text x="43.0" y="95.0" font-size="15" text-anchor="end">12</text><text x="491" y="515" font-size="17" text-anchor="start">x</text><text x="53" y="75" font-size="17" text-anchor="start">y</text><rect x="55.0" y="160.0" width="350.0" height="350.0" fill="none" fill-opacity="1" stroke="#248a72" stroke-width="3"/><rect x="160.0" y="195.0" width="245.0" height="315.0" fill="none" fill-opacity="1" stroke="#c37d2b" stroke-width="3" stroke-dasharray="6 4"/><rect x="125.0" y="230.0" width="70.0" height="70.0" fill="#d7f0e6" fill-opacity="0.6" stroke="#248a72" stroke-width="2"/><path d="M55.0,510.0 L405.0,160.0" stroke="#365d89" stroke-width="2.5" fill="none"/><rect x="233.0" y="327.5" width="30" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="248.0" y="344.5" font-size="14" text-anchor="middle">L1</text><path d="M55.0,265.0 L265.0,265.0" stroke="#365d89" stroke-width="2.5" fill="none"/><rect x="226.0" y="240.0" width="30" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="241.0" y="257.0" font-size="14" text-anchor="middle">L2</text><path d="M335.0,510.0 L405.0,440.0" stroke="#365d89" stroke-width="2.5" fill="none"/><rect x="348.50000000000006" y="457.0" width="30" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="363.50000000000006" y="474.0" font-size="14" text-anchor="middle">L3</text><path d="M160.0,335.0 L160.0,195.0" stroke="#365d89" stroke-width="2.5" fill="none"/><rect x="163.0" y="198.00000000000006" width="30" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="178.0" y="215.00000000000006" font-size="14" text-anchor="middle">L4</text><path d="M230.0,300.0 L370.0,230.0" stroke="#365d89" stroke-width="2.5" fill="none"/><rect x="303.0" y="240.0" width="30" height="23" rx="4" fill="white" stroke="#8297aa"/><text x="318.0" y="257.0" font-size="14" text-anchor="middle">L5</text><rect x="670" y="95" width="100" height="45" rx="4" fill="#d5e9ff" stroke="#8297aa"/><text x="720" y="125" font-size="20" text-anchor="middle">root</text><path d="M720,140 L590,240" stroke="#71889b" stroke-width="2" fill="none"/><rect x="525" y="240" width="130" height="50" rx="4" fill="#d7f0e6" stroke="#8297aa"/><text x="590" y="272" font-size="20" text-anchor="middle">Group U</text><text x="590" y="335" font-size="20" text-anchor="middle">L1, L2</text><path d="M720,140 L850,240" stroke="#71889b" stroke-width="2" fill="none"/><rect x="785" y="240" width="130" height="50" rx="4" fill="#ffe5c5" stroke="#8297aa"/><text x="850" y="272" font-size="20" text-anchor="middle">Group V</text><text x="850" y="335" font-size="20" text-anchor="middle">L3, L4, L5</text><text x="525" y="430" font-size="19" text-anchor="start">U bounds: (0,0,10,10)</text><text x="525" y="470" font-size="19" text-anchor="start">V bounds: (3,0,10,9)</text><text x="525" y="515" font-size="18" text-anchor="start">Query (2,6,4,8) reaches both groups.</text><text x="24" y="590" font-size="19" text-anchor="start">Solid green = U bound; dashed orange = V bound. Neither is a partition cell.</text></g></svg>