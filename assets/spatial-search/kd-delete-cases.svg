<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">K-d deletion keeps the pivot depth</title><desc id="desc">Right child: minimum on the pivot axis replaces the point. Left-only: minimum from the left replaces the point and its remainder moves to the right at the same depth. A leaf is removed.</desc><style>text{font-family:Arial,sans-serif;fill:#18334a;font-size:18px} .heading{font-size:23px;font-weight:bold} .small{font-size:16px} .node{fill:#edf5fc;stroke:#346887;stroke-width:2} .edge{stroke:#60798a;stroke-width:2;fill:none} .note{fill:#a13d20} </style><rect width="900" height="380" rx="12" fill="#fff"/><text x="25" y="37" class="heading">Keep the depth, preserve the active axis</text>
<path d="M300 60V350M600 60V350" stroke="#d1dce5"/>
<text x="25" y="85">Right subtree exists</text><rect class="node" x="55" y="120" width="180" height="55" rx="8"/><text x="74" y="154">replace pivot</text><path class="edge" d="M145 175L215 220"/><rect class="node" x="135" y="220" width="135" height="55" rx="8"/><text x="155" y="253">right min</text><text x="25" y="310" class="small">Find minimum on pivot axis.</text><text x="25" y="337" class="small">Delete its old occurrence.</text>
<text x="325" y="85">Only left subtree</text><rect class="node" x="355" y="120" width="180" height="55" rx="8"/><text x="374" y="154">replace pivot</text><path class="edge" d="M445 175L375 220M445 175L515 220"/><text x="325" y="250">empty</text><rect class="node" x="455" y="220" width="120" height="55" rx="8"/><text x="469" y="253" class="small">remainder</text><text x="325" y="310" class="small">Take minimum from the left.</text><text x="325" y="337" class="small">Move its remainder right.</text>
<text x="625" y="85">Leaf</text><rect class="node" x="665" y="120" width="160" height="55" rx="8"/><text x="692" y="154">remove</text><text x="625" y="250">Return None.</text><text x="625" y="310" class="small">Parent link becomes empty.</text><text x="625" y="337" class="small">No descendant axes change.</text></svg>