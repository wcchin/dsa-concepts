<svg xmlns="http://www.w3.org/2000/svg" width="850" height="510" viewBox="0 0 850 510" role="img" aria-labelledby="title desc"><title id="title">A subset-sum decision tree</title><desc id="desc">First two decisions for values2 3 4 and target5 show include and exclude branches. Choosing2 then3 reaches zero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="23" text-anchor="start">Subset search: include or exclude each position once</text><path d="M400,115 L210,180" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="305.0" y="150.0" font-size="16" text-anchor="middle">take 2</text><path d="M400,115 L625,180" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="512.5" y="150.0" font-size="16" text-anchor="middle">skip 2</text><path d="M210,225 L100,310" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="155.0" y="270.0" font-size="16" text-anchor="middle">take 3</text><path d="M210,225 L320,310" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="265.0" y="270.0" font-size="16" text-anchor="middle">skip 3</text><path d="M625,225 L540,310" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="582.5" y="270.0" font-size="16" text-anchor="middle">take 3</text><path d="M625,225 L740,310" stroke="#71889b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="682.5" y="270.0" font-size="16" text-anchor="middle">skip 3</text><rect x="345" y="73" width="110" height="44" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="400" y="101" font-size="18" text-anchor="middle">need 5</text><rect x="155" y="183" width="110" height="44" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="210" y="211" font-size="18" text-anchor="middle">need 3</text><rect x="570" y="183" width="110" height="44" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="625" y="211" font-size="18" text-anchor="middle">need 5</text><rect x="45" y="313" width="110" height="44" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="100" y="341" font-size="18" text-anchor="middle">need 0</text><rect x="265" y="313" width="110" height="44" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="320" y="341" font-size="18" text-anchor="middle">need 3</text><rect x="485" y="313" width="110" height="44" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="540" y="341" font-size="18" text-anchor="middle">need 2</text><rect x="685" y="313" width="110" height="44" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="740" y="341" font-size="18" text-anchor="middle">need 5</text><text x="24" y="425" font-size="20" text-anchor="start">Values [2,3,4], target 5. Green branch records positions [0,1].</text><text x="24" y="470" font-size="19" text-anchor="start">Other branches continue with value 4; none reaches the target 5.</text></g></svg>