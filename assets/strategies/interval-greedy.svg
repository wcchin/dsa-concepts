<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img" aria-labelledby="title desc"><title id="title">Earliest finish versus shortest duration</title><desc id="desc">A spans0 to3, C2 to4 and B3 to6. A then B are compatible; C overlaps both.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="22" text-anchor="start">Earliest finish leaves the most room for compatible activities</text><text x="24" y="147" font-size="22" text-anchor="start">A</text><rect x="100" y="120" width="300" height="45" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="110" y="150" font-size="20" text-anchor="start">[0,3)</text><text x="24" y="242" font-size="22" text-anchor="start">C</text><rect x="300" y="215" width="200" height="45" rx="5" fill="#ffe5c5" stroke="#8196a7"/><text x="310" y="245" font-size="20" text-anchor="start">[2,4)</text><text x="24" y="337" font-size="22" text-anchor="start">B</text><rect x="400" y="310" width="300" height="45" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="410" y="340" font-size="20" text-anchor="start">[3,6)</text><text x="100" y="90" font-size="17" text-anchor="middle">0</text><text x="200" y="90" font-size="17" text-anchor="middle">1</text><text x="300" y="90" font-size="17" text-anchor="middle">2</text><text x="400" y="90" font-size="17" text-anchor="middle">3</text><text x="500" y="90" font-size="17" text-anchor="middle">4</text><text x="600" y="90" font-size="17" text-anchor="middle">5</text><text x="700" y="90" font-size="17" text-anchor="middle">6</text><text x="24" y="455" font-size="19" text-anchor="start">Choose A, then B: 2 activities. Shortest duration chooses C: only 1.</text></g></svg>