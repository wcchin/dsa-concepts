<svg xmlns="http://www.w3.org/2000/svg" width="850" height="520" viewBox="0 0 850 520" role="img" aria-labelledby="title desc"><title id="title">Fixed-window sums and prefix sums</title><desc id="desc">For values3 1 4 2, a two-item window moves from sum4 to sum5 by removing3 and adding4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="23" text-anchor="start">A fixed window updates in constant work per move</text><rect x="120" y="115" width="110" height="65" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="175" y="158" font-size="26" text-anchor="middle">3</text><rect x="270" y="115" width="110" height="65" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="325" y="158" font-size="26" text-anchor="middle">1</text><rect x="420" y="115" width="110" height="65" rx="5" fill="#eef1f5" stroke="#8196a7"/><text x="475" y="158" font-size="26" text-anchor="middle">4</text><rect x="570" y="115" width="110" height="65" rx="5" fill="#eef1f5" stroke="#8196a7"/><text x="625" y="158" font-size="26" text-anchor="middle">2</text><text x="24" y="210" font-size="21" text-anchor="start">sum = 4</text><rect x="120" y="275" width="110" height="65" rx="5" fill="#eef1f5" stroke="#8196a7"/><text x="175" y="318" font-size="26" text-anchor="middle">3</text><rect x="270" y="275" width="110" height="65" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="325" y="318" font-size="26" text-anchor="middle">1</text><rect x="420" y="275" width="110" height="65" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="475" y="318" font-size="26" text-anchor="middle">4</text><rect x="570" y="275" width="110" height="65" rx="5" fill="#eef1f5" stroke="#8196a7"/><text x="625" y="318" font-size="26" text-anchor="middle">2</text><text x="24" y="370" font-size="21" text-anchor="start">sum = 5</text><text x="24" y="425" font-size="20" text-anchor="start">Move [0,2) to [1,3): previous 4 − outgoing 3 + incoming 4 = 5.</text><text x="24" y="475" font-size="20" text-anchor="start">Prefix sums [0,3,4,8,10] answer [1,3) as 8 − 3 = 5.</text></g></svg>