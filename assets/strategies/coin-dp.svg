<svg xmlns="http://www.w3.org/2000/svg" width="850" height="460" viewBox="0 0 850 460" role="img" aria-labelledby="title desc"><title id="title">The dynamic-programming table for coin change</title><desc id="desc">For coins1 3 4, optimal counts for amounts0 through6 are0 1 2 1 1 2 2. Amount6 uses3 plus3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#71889b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="24" y="35" font-size="23" text-anchor="start">Coin change: build each amount from smaller solved amounts</text><text x="80" y="115" font-size="18" text-anchor="middle">a = 0</text><rect x="35" y="145" width="90" height="65" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="80" y="188" font-size="26" text-anchor="middle">0</text><text x="190" y="115" font-size="18" text-anchor="middle">a = 1</text><rect x="145" y="145" width="90" height="65" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="190" y="188" font-size="26" text-anchor="middle">1</text><text x="300" y="115" font-size="18" text-anchor="middle">a = 2</text><rect x="255" y="145" width="90" height="65" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="300" y="188" font-size="26" text-anchor="middle">2</text><text x="410" y="115" font-size="18" text-anchor="middle">a = 3</text><rect x="365" y="145" width="90" height="65" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="410" y="188" font-size="26" text-anchor="middle">1</text><text x="520" y="115" font-size="18" text-anchor="middle">a = 4</text><rect x="475" y="145" width="90" height="65" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="520" y="188" font-size="26" text-anchor="middle">1</text><text x="630" y="115" font-size="18" text-anchor="middle">a = 5</text><rect x="585" y="145" width="90" height="65" rx="5" fill="#d5e9ff" stroke="#8196a7"/><text x="630" y="188" font-size="26" text-anchor="middle">2</text><text x="740" y="115" font-size="18" text-anchor="middle">a = 6</text><rect x="695" y="145" width="90" height="65" rx="5" fill="#d7f0e6" stroke="#8196a7"/><text x="740" y="188" font-size="26" text-anchor="middle">2</text><text x="24" y="280" font-size="21" text-anchor="start">Coins {1,3,4}: best[6] = min(best[5], best[3], best[2]) + 1</text><text x="24" y="345" font-size="21" text-anchor="start">Choose coin 3, then coin 3: two coins make amount 6.</text><text x="24" y="415" font-size="19" text-anchor="start">Greedy takes 4 + 1 + 1: three coins, so this greedy rule is not optimal.</text></g></svg>