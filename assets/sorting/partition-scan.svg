<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" aria-labelledby="title desc"><title id="title">Partition with pivot 5</title><desc id="desc">Green keys are at most 5, orange keys are larger; each row shows boundary and scan. Final result 2,3,5,7,6.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="20" y="28" font-size="21" text-anchor="start">Partition: ≤ 5 | &gt; 5 | unknown | pivot</text><text x="20" y="84" font-size="16" text-anchor="start">Start</text><rect x="240" y="55" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="267" y="84" font-size="22" text-anchor="middle">7</text><rect x="302" y="55" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="329" y="84" font-size="22" text-anchor="middle">2</text><rect x="364" y="55" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="391" y="84" font-size="22" text-anchor="middle">6</text><rect x="426" y="55" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="453" y="84" font-size="22" text-anchor="middle">3</text><rect x="488" y="55" width="54" height="44" rx="6" fill="#d5e9ff" stroke="#8393a3"/><text x="515" y="84" font-size="22" text-anchor="middle">5</text><text x="570" y="84" font-size="14" text-anchor="start">b=0, s=0</text><text x="20" y="150" font-size="16" text-anchor="start">7 &gt; 5: advance scan</text><rect x="240" y="121" width="54" height="44" rx="6" fill="#ffe5c5" stroke="#8393a3"/><text x="267" y="150" font-size="22" text-anchor="middle">7</text><rect x="302" y="121" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="329" y="150" font-size="22" text-anchor="middle">2</text><rect x="364" y="121" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="391" y="150" font-size="22" text-anchor="middle">6</text><rect x="426" y="121" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="453" y="150" font-size="22" text-anchor="middle">3</text><rect x="488" y="121" width="54" height="44" rx="6" fill="#d5e9ff" stroke="#8393a3"/><text x="515" y="150" font-size="22" text-anchor="middle">5</text><text x="570" y="150" font-size="14" text-anchor="start">b=0, s=1</text><text x="20" y="216" font-size="16" text-anchor="start">2 ≤ 5: swap; advance</text><rect x="240" y="187" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="267" y="216" font-size="22" text-anchor="middle">2</text><rect x="302" y="187" width="54" height="44" rx="6" fill="#ffe5c5" stroke="#8393a3"/><text x="329" y="216" font-size="22" text-anchor="middle">7</text><rect x="364" y="187" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="391" y="216" font-size="22" text-anchor="middle">6</text><rect x="426" y="187" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="453" y="216" font-size="22" text-anchor="middle">3</text><rect x="488" y="187" width="54" height="44" rx="6" fill="#d5e9ff" stroke="#8393a3"/><text x="515" y="216" font-size="22" text-anchor="middle">5</text><text x="570" y="216" font-size="14" text-anchor="start">b=1, s=2</text><text x="20" y="282" font-size="16" text-anchor="start">6 &gt; 5: advance scan</text><rect x="240" y="253" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="267" y="282" font-size="22" text-anchor="middle">2</text><rect x="302" y="253" width="54" height="44" rx="6" fill="#ffe5c5" stroke="#8393a3"/><text x="329" y="282" font-size="22" text-anchor="middle">7</text><rect x="364" y="253" width="54" height="44" rx="6" fill="#ffe5c5" stroke="#8393a3"/><text x="391" y="282" font-size="22" text-anchor="middle">6</text><rect x="426" y="253" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="453" y="282" font-size="22" text-anchor="middle">3</text><rect x="488" y="253" width="54" height="44" rx="6" fill="#d5e9ff" stroke="#8393a3"/><text x="515" y="282" font-size="22" text-anchor="middle">5</text><text x="570" y="282" font-size="14" text-anchor="start">b=1, s=3</text><text x="20" y="348" font-size="16" text-anchor="start">3 ≤ 5: swap; advance</text><rect x="240" y="319" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="267" y="348" font-size="22" text-anchor="middle">2</text><rect x="302" y="319" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="329" y="348" font-size="22" text-anchor="middle">3</text><rect x="364" y="319" width="54" height="44" rx="6" fill="#ffe5c5" stroke="#8393a3"/><text x="391" y="348" font-size="22" text-anchor="middle">6</text><rect x="426" y="319" width="54" height="44" rx="6" fill="#ffe5c5" stroke="#8393a3"/><text x="453" y="348" font-size="22" text-anchor="middle">7</text><rect x="488" y="319" width="54" height="44" rx="6" fill="#d5e9ff" stroke="#8393a3"/><text x="515" y="348" font-size="22" text-anchor="middle">5</text><text x="570" y="348" font-size="14" text-anchor="start">b=2, s=4</text><text x="20" y="414" font-size="16" text-anchor="start">Place pivot at p = 2</text><rect x="240" y="385" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="267" y="414" font-size="22" text-anchor="middle">2</text><rect x="302" y="385" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="329" y="414" font-size="22" text-anchor="middle">3</text><rect x="364" y="385" width="54" height="44" rx="6" fill="#d5e9ff" stroke="#8393a3"/><text x="391" y="414" font-size="22" text-anchor="middle">5</text><rect x="426" y="385" width="54" height="44" rx="6" fill="#ffe5c5" stroke="#8393a3"/><text x="453" y="414" font-size="22" text-anchor="middle">7</text><rect x="488" y="385" width="54" height="44" rx="6" fill="#ffe5c5" stroke="#8393a3"/><text x="515" y="414" font-size="22" text-anchor="middle">6</text><text x="20" y="465" font-size="16" text-anchor="start">b = boundary; s = scan. The final right-hand region is not sorted.</text></g></svg>