<svg xmlns="http://www.w3.org/2000/svg" width="590" height="325" viewBox="0 0 590 325" role="img" aria-labelledby="title desc"><title id="title">Shifting to insert 3</title><desc id="desc">The gap moves left as 7 and 6 shift right. The saved 3 fills it after 2.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="20" y="30" font-size="21" text-anchor="start">Save item = 3; move larger keys right</text><text x="20" y="84" font-size="16" text-anchor="start">Save 3</text><rect x="240" y="55" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="267" y="84" font-size="22" text-anchor="middle">2</text><rect x="302" y="55" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="329" y="84" font-size="22" text-anchor="middle">6</text><rect x="364" y="55" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="391" y="84" font-size="22" text-anchor="middle">7</text><rect x="426" y="55" width="54" height="44" rx="6" fill="#ffffff" stroke="#8393a3"/><text x="453" y="84" font-size="22" text-anchor="middle">gap</text><rect x="488" y="55" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="515" y="84" font-size="22" text-anchor="middle">5</text><text x="20" y="149" font-size="16" text-anchor="start">Shift 7</text><rect x="240" y="120" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="267" y="149" font-size="22" text-anchor="middle">2</text><rect x="302" y="120" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="329" y="149" font-size="22" text-anchor="middle">6</text><rect x="364" y="120" width="54" height="44" rx="6" fill="#ffffff" stroke="#8393a3"/><text x="391" y="149" font-size="22" text-anchor="middle">gap</text><rect x="426" y="120" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="453" y="149" font-size="22" text-anchor="middle">7</text><rect x="488" y="120" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="515" y="149" font-size="22" text-anchor="middle">5</text><text x="20" y="214" font-size="16" text-anchor="start">Shift 6; stop at 2</text><rect x="240" y="185" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="267" y="214" font-size="22" text-anchor="middle">2</text><rect x="302" y="185" width="54" height="44" rx="6" fill="#ffffff" stroke="#8393a3"/><text x="329" y="214" font-size="22" text-anchor="middle">gap</text><rect x="364" y="185" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="391" y="214" font-size="22" text-anchor="middle">6</text><rect x="426" y="185" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="453" y="214" font-size="22" text-anchor="middle">7</text><rect x="488" y="185" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="515" y="214" font-size="22" text-anchor="middle">5</text><text x="20" y="279" font-size="16" text-anchor="start">Fill with saved 3</text><rect x="240" y="250" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="267" y="279" font-size="22" text-anchor="middle">2</text><rect x="302" y="250" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="329" y="279" font-size="22" text-anchor="middle">3</text><rect x="364" y="250" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="391" y="279" font-size="22" text-anchor="middle">6</text><rect x="426" y="250" width="54" height="44" rx="6" fill="#d7f0e6" stroke="#8393a3"/><text x="453" y="279" font-size="22" text-anchor="middle">7</text><rect x="488" y="250" width="54" height="44" rx="6" fill="#eef1f5" stroke="#8393a3"/><text x="515" y="279" font-size="22" text-anchor="middle">5</text></g></svg>