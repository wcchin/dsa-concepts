<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" role="img" aria-labelledby="title desc"><title id="title">Quicksort on five values</title><desc id="desc">Pivot 5 splits ranges 2,3 and 7,6. Their pivots 3 and 6 leave singleton ranges 2 and 7.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="20" y="28" font-size="21" text-anchor="start">Quicksort: pivot positions separate recursive ranges</text><path d="M350,98 L170,145" stroke="#60778a" stroke-width="1.8" fill="none"/><path d="M350,98 L530,145" stroke="#60778a" stroke-width="1.8" fill="none"/><path d="M170,187 L90,240" stroke="#60778a" stroke-width="1.8" fill="none"/><path d="M530,187 L610,240" stroke="#60778a" stroke-width="1.8" fill="none"/><rect x="235.0" y="56" width="230" height="42" rx="7" fill="#eef1f5" stroke="#8393a3"/><text x="350" y="83" font-size="18" text-anchor="middle">[7, 2, 6, 3, 5]</text><rect x="232" y="106" width="236" height="25" fill="white"/><text x="350" y="126" font-size="16" text-anchor="middle">pivot 5 fixed at index 2</text><rect x="75.0" y="145" width="190" height="42" rx="7" fill="#d7f0e6" stroke="#8393a3"/><text x="170" y="172" font-size="18" text-anchor="middle">[2, 3] → [2] | 3</text><rect x="435.0" y="145" width="190" height="42" rx="7" fill="#d5e9ff" stroke="#8393a3"/><text x="530" y="172" font-size="18" text-anchor="middle">[7, 6] → 6 | [7]</text><rect x="42.5" y="240" width="95" height="42" rx="7" fill="#eef1f5" stroke="#8393a3"/><text x="90" y="267" font-size="18" text-anchor="middle">[2]</text><rect x="562.5" y="240" width="95" height="42" rx="7" fill="#eef1f5" stroke="#8393a3"/><text x="610" y="267" font-size="18" text-anchor="middle">[7]</text><text x="350" y="224" font-size="16" text-anchor="middle">Pivots 3 and 6 are fixed.</text><text x="350" y="320" font-size="22" text-anchor="middle">Result: [2, 3, 5, 6, 7]</text><text x="350" y="355" font-size="16" text-anchor="middle">Empty ranges return immediately and are omitted.</text></g></svg>