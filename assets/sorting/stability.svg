<svg xmlns="http://www.w3.org/2000/svg" width="610" height="310" viewBox="0 0 610 310" role="img" aria-labelledby="title desc"><title id="title">Stable ordering of student records</title><desc id="desc">Ben moves first by score. Alice stays before Chen among the equal scores.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#182f49"><text x="20" y="30" font-size="21" text-anchor="start">Stability: compare scores, preserve ties</text><text x="20" y="97" font-size="17" text-anchor="start">Input</text><rect x="170" y="65" width="125" height="70" rx="8" fill="#d7f0e6" stroke="#8393a3"/><text x="232" y="92" font-size="19" text-anchor="middle">Alice</text><text x="232" y="118" font-size="18" text-anchor="middle">80</text><rect x="310" y="65" width="125" height="70" rx="8" fill="#d5e9ff" stroke="#8393a3"/><text x="372" y="92" font-size="19" text-anchor="middle">Ben</text><text x="372" y="118" font-size="18" text-anchor="middle">70</text><rect x="450" y="65" width="125" height="70" rx="8" fill="#d7f0e6" stroke="#8393a3"/><text x="512" y="92" font-size="19" text-anchor="middle">Chen</text><text x="512" y="118" font-size="18" text-anchor="middle">80</text><text x="20" y="207" font-size="17" text-anchor="start">Stable output</text><rect x="170" y="175" width="125" height="70" rx="8" fill="#d5e9ff" stroke="#8393a3"/><text x="232" y="202" font-size="19" text-anchor="middle">Ben</text><text x="232" y="228" font-size="18" text-anchor="middle">70</text><rect x="310" y="175" width="125" height="70" rx="8" fill="#d7f0e6" stroke="#8393a3"/><text x="372" y="202" font-size="19" text-anchor="middle">Alice</text><text x="372" y="228" font-size="18" text-anchor="middle">80</text><rect x="450" y="175" width="125" height="70" rx="8" fill="#d7f0e6" stroke="#8393a3"/><text x="512" y="202" font-size="19" text-anchor="middle">Chen</text><text x="512" y="228" font-size="18" text-anchor="middle">80</text><text x="20" y="285" font-size="17" text-anchor="start">Alice and Chen tie at 80; Alice remains before Chen.</text></g></svg>