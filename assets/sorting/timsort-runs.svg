<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Natural runs and stable merging</title><desc id="desc">Two ascending runs 1 4 7 and 2 3 8 merge into 1 2 3 4 7 8. This is a conceptual merge trace; short runs in production may first be extended by insertion sorting.</desc><style>text{font-family:Arial,sans-serif;fill:#19334a;font-size:21px}.title{font-size:25px;font-weight:bold}.small{font-size:17px}.blue{fill:#e9f3fb;stroke:#3f7194;stroke-width:2}.green{fill:#e9f6ef;stroke:#3b8363;stroke-width:2}</style><rect width="900" height="360" rx="12" fill="white"/><text x="28" y="40" class="title">Use ordered runs instead of discarding their order</text><rect x="40" y="85" width="340" height="60" rx="9" class="blue"/><text x="100" y="124" text-anchor="middle">1</text><text x="210" y="124" text-anchor="middle">4</text><text x="320" y="124" text-anchor="middle">7</text><rect x="500" y="85" width="340" height="60" rx="9" class="green"/><text x="560" y="124" text-anchor="middle">2</text><text x="670" y="124" text-anchor="middle">3</text><text x="780" y="124" text-anchor="middle">8</text><path d="M210 145L330 205M670 145L550 205" stroke="#6c8292" stroke-width="2"/><text x="395" y="189">merge</text><rect x="160" y="210" width="570" height="60" rx="9" class="blue"/><text x="210" y="249" text-anchor="middle">1</text><text x="305" y="249" text-anchor="middle">2</text><text x="400" y="249" text-anchor="middle">3</text><text x="495" y="249" text-anchor="middle">4</text><text x="590" y="249" text-anchor="middle">7</text><text x="685" y="249" text-anchor="middle">8</text><text x="40" y="310" class="small">Conceptual trace: short runs may be extended with insertion sorting first.</text><text x="40" y="338" class="small">Powersort addresses which adjacent runs to merge when lengths differ.</text></svg>